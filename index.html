// ── Shared Firebase listener ──────────────────────────────────────────────────
function listenToState(code,root,cleanFn){
  const ref=db.ref(`${root}/${code}/state`);
  if(stateRefListener&&stateCallback)stateRefListener.off("value",stateCallback);
  if(statePoller)clearInterval(statePoller);
  stateRefListener=ref;
  stateCallback=snap=>{
    if(!snap.exists())return;
    const fresh=cleanFn(snap.val());
    if(JSON.stringify(gs||{})!==JSON.stringify(fresh||{})){gs=fresh;syncLocal();render();}
  };
  ref.on("value",stateCallback);
  statePoller=setInterval(async()=>{
    try{
      const snap=await ref.once("value");
      if(!snap.exists())return;
      const fresh=cleanFn(snap.val());
      if(JSON.stringify(gs||{})!==JSON.stringify(fresh||{})){gs=fresh;syncLocal();render();}
    }catch(e){}
  },700);
}

// ═══════════════════════════════════════════════════════
// BLITZ GAME
// ═══════════════════════════════════════════════════════
const B_ROOT="blitz7";
const B_CATS=["Animal","Country","Food or Drink","City","Movie","TV Show","Sport","Famous Brand","Occupation","Musical Artist","Book or Novel","Famous Person","Plant or Flower","Vehicle","Kitchen Item","Clothing Item","Something Cold","Body Part","Type of Music","Board Game","Thing in a Gym","Language","Cricketer","Actor","Cartoon Character","Movie Character","Superhero","Red Flag","Green Flag","Car","Something in a Bedroom","Something in a Bathroom","Something Yellow","Something Red","Food","Drink","Street Food","A Snack","Famous Landmark or Monument","Something Hot","Thing Found on a Beach","Sea Creature","Something in Space","Thing in a Forest","Something Expensive","Something Sticky","Something Round","Something Spicy","Something Romantic","Something Scary","Superpower","Type of Dance","A Phobia","App or Website","Famous Villain","Something That Can Fly","Holiday Packing Item","Thing at a Party","A Bad Habit","Something You Do on a Sunday","Thing in a Hotel Room","Thing in a Jungle","Something in a Museum","A Cocktail","Famous Duo or Couple"];
const B_LETS="ABCDEFGHIJKLMNOPRSTUVWY".split("");
const B_R_SEC=60,B_C_SEC=15,B_N_RDS=8;

let B_hasSubmitted=false,B_hasVoted=false,B_lastRound=-1,B_lastCIdx=-1;
let B_roundTimer=null,B_chalTimer=null;

const B_stRef=()=>db.ref(`${B_ROOT}/${roomCode}/state`);
const B_acRef=()=>db.ref(`${B_ROOT}/${roomCode}/actions`);
const B_myAcRef=()=>db.ref(`${B_ROOT}/${roomCode}/actions/${myId}`);
const B_clean=r=>!r?null:{...r,players:toArr(r.players),subs:toArr(r.subs),used:toArr(r.used),cVotes:r.cVotes||{},result:r.result||null};
const B_pickCombo=used=>{let l,c,k,t=0;do{l=B_LETS[~~(Math.random()*B_LETS.length)];c=B_CATS[~~(Math.random()*B_CATS.length)];k=`${l}:${c}`;t++}while(used.includes(k)&&t<100);return{l,c,k};};

async function B_createRoom(){
  roomCode=rc();isHost=true;
  gs={phase:"lobby",round:0,total:B_N_RDS,letter:null,cat:null,rStart:null,subs:[],cStart:null,cVotes:{},cIdx:0,result:null,used:[],players:[{id:myId,name:myName,av:myAv,score:0}]};
  await B_stRef().set(gs);
  actTimer=setInterval(B_processActions,800);
  listenToState(roomCode,B_ROOT,B_clean);
  render();
}

async function B_processActions(){
  const snap=await B_acRef().once("value");const acts=snap.val();if(!acts)return;
  let dirty=false;
  for(const[pid,act]of Object.entries(acts)){
    if(!act||!act.type)continue;
    db.ref(`${B_ROOT}/${roomCode}/actions/${pid}`).remove();
    if(act.type==="JOIN"&&!gs.players.find(p=>p.id===pid)){gs.players.push({id:pid,name:act.name,av:act.av,score:0});dirty=true;}
    if(act.type==="SUBMIT"&&gs.phase==="active"&&!gs.subs.find(s=>s.pid===pid)){
      gs.subs.push({id:uid(),pid,pname:act.name,pav:act.av,answer:act.answer,ts:ms()});
      if(gs.subs.length===1){clearTimeout(B_roundTimer);Object.assign(gs,{phase:"challenge",cStart:ms(),cIdx:0,cVotes:{}});B_startChalTimer();}
      dirty=true;
    }
    if(act.type==="VOTE"&&gs.phase==="challenge"&&!gs.cVotes[pid]){
      gs.cVotes[pid]=act.vote;dirty=true;
      const sub=gs.subs[gs.cIdx];const others=gs.players.filter(p=>p.id!==sub?.pid);
      if(others.length>0&&others.every(p=>gs.cVotes[p.id])){clearTimeout(B_chalTimer);B_resolveChallenge();return;}
    }
  }
  if(dirty){await B_stRef().set(gs);render();}
}

async function B_startGame(){
  gs.players=gs.players.map(p=>({...p,score:0}));
  const{l,c,k}=B_pickCombo(gs.used||[]);
  Object.assign(gs,{phase:"active",round:1,letter:l,cat:c,rStart:ms(),subs:[],cVotes:{},cIdx:0,result:null,used:[k]});
  B_startRoundTimer();await B_stRef().set(gs);render();
}

async function B_resolveChallenge(){
  const sub=gs.subs[gs.cIdx];if(!sub){B_endRound();return;}
  const others=gs.players.filter(p=>p.id!==sub.pid);
  const ch=others.filter(p=>gs.cVotes[p.id]==="ch").length;
  if(others.length>0&&ch>others.length/2){
    const ni=gs.cIdx+1;
    if(ni<gs.subs.length){Object.assign(gs,{cIdx:ni,cVotes:{},cStart:ms()});B_startChalTimer();await B_stRef().set(gs);render();return;}
    gs.phase=gs.round>=gs.total?"finished":"result";gs.result=null;
  }else{
    const pl=gs.players.find(p=>p.id===sub.pid);if(pl)pl.score++;
    gs.phase=gs.round>=gs.total?"finished":"result";
    gs.result={wId:sub.pid,wName:sub.pname,wAv:sub.pav,ans:sub.answer};
  }
  await B_stRef().set(gs);render();
}

async function B_endRound(){
  if(gs.phase!=="active"&&gs.phase!=="challenge")return;
  gs.phase=gs.round>=gs.total?"finished":"result";gs.result=null;
  await B_stRef().set(gs);render();
}

async function B_nextRound(){
  const{l,c,k}=B_pickCombo(gs.used);
  Object.assign(gs,{phase:"active",round:gs.round+1,letter:l,cat:c,rStart:ms(),subs:[],cVotes:{},cIdx:0,result:null});
  gs.used.push(k);B_startRoundTimer();await B_stRef().set(gs);render();
}

async function B_rematch(){
  gs.players=gs.players.map(p=>({...p,score:0}));gs.round=0;gs.used=[];gs.subs=[];gs.result=null;gs.cVotes={};
  await B_stRef().set(gs);await B_startGame();
}

function B_startRoundTimer(){clearTimeout(B_roundTimer);B_roundTimer=setTimeout(()=>B_endRound(),B_R_SEC*1000);}
function B_startChalTimer(){clearTimeout(B_chalTimer);B_chalTimer=setTimeout(()=>B_resolveChallenge(),B_C_SEC*1000);}

async function B_joinRoom(code){
  roomCode=code;isHost=false;
  const snap=await db.ref(`${B_ROOT}/${code}/state`).once("value");
  if(!snap.exists()){toast("Room not found!","err");roomCode="";render();return;}
  const data=B_clean(snap.val());
  if(data.phase!=="lobby"){toast("Game already started!","err");roomCode="";render();return;}
  gs=data;
  await B_myAcRef().set({type:"JOIN",name:myName,av:myAv,_ts:ms()});
  listenToState(code,B_ROOT,B_clean);render();
}

async function B_submitAnswer(){
  const inp=document.getElementById("ans-inp");if(!inp||inp.disabled)return;
  const answer=inp.value.trim();
  if(!answer){toast("Type something!","err");return;}
  if(answer[0].toUpperCase()!==gs.letter){toast(`Must start with "${gs.letter}"!`,"err");return;}
  inp.disabled=true;const btn=document.getElementById("ans-btn");
  if(btn){btn.disabled=true;btn.textContent="Sent ✓";}
  B_hasSubmitted=true;
  if(isHost){
    if(!gs.subs.find(s=>s.pid===myId)){
      gs.subs.push({id:uid(),pid:myId,pname:myName,pav:myAv,answer,ts:ms()});
      if(gs.subs.length===1){clearTimeout(B_roundTimer);Object.assign(gs,{phase:"challenge",cStart:ms(),cIdx:0,cVotes:{}});B_startChalTimer();}
      await B_stRef().set(gs);render();
    }
  }else{await B_myAcRef().set({type:"SUBMIT",name:myName,av:myAv,answer,_ts:ms()});}
}

async function B_vote(v){
  if(B_hasVoted)return;B_hasVoted=true;
  document.querySelectorAll(".vbtn").forEach(b=>{b.disabled=true;b.style.opacity=.4;});
  if(isHost){
    gs.cVotes[myId]=v;const sub=gs.subs[gs.cIdx];const others=gs.players.filter(p=>p.id!==sub?.pid);
    if(others.length>0&&others.every(p=>gs.cVotes[p.id])){clearTimeout(B_chalTimer);B_resolveChallenge();}
    else{await B_stRef().set(gs);render();}
  }else{await B_myAcRef().set({type:"VOTE",vote:v,_ts:ms()});}
}

    else if(gs.phase==="challenge"&&gs.cStart){left=Math.max(0,B_C_SEC-(ms()-gs.cStart)/1000);tot=B_C_SEC;}

    const s=Math.ceil(left),col=s<=10?"var(--pk)":s<=20?"var(--y)":"var(--gr)";

  },250);
}

let B_screenSig=null;

function renderBlitz(){
  clearInterval(displayTimer);
  const app=document.getElementById("app");if(!app)return;
  const p=gs?.phase||"";
  try{
    // Signature = what determines the SHAPE of the screen. If only counts/scores
    // changed, the signature is identical and we patch instead of rebuilding,
    // which prevents the flicker on phones/tablets.
    const myAnswered = !!(gs?.subs||[]).find(s=>s.pid===myId);
    const myVoted = !!(gs?.cVotes||{})[myId];
    const sig = !gs||!roomCode ? "setup"
      : `${p}|${gs.round}|${gs.cIdx??0}|${(gs.subs||[]).length>0}|${myAnswered}|${myVoted}`;

    if(sig===B_screenSig && (p==="active"||p==="challenge"||p==="lobby")){
      // same screen — just refresh the live bits, no DOM teardown
      B_patch();
      if(p==="active"||p==="challenge"){ syncLocal(); B_startDisplay(); }
      return;
    }
    B_screenSig=sig;

    if(!gs||!roomCode)          app.innerHTML=B_scrSetup();
    else if(p==="lobby")        app.innerHTML=B_scrLobby();
    else if(p==="active")      {app.innerHTML=B_scrActive();   syncLocal();B_startDisplay();}
    else if(p==="challenge")   {app.innerHTML=B_scrChallenge();syncLocal();B_startDisplay();}
    else if(p==="result")       app.innerHTML=B_scrResult();
    else if(p==="finished")     app.innerHTML=B_scrFinished();
    bindBlitz();
  }catch(e){console.error("blitz render err",e);}
}

// Refresh only the dynamic elements of the current Blitz screen (no rebuild)
function B_patch(){
  const sc=document.getElementById("b-scores");
  if(sc) sc.innerHTML=B_chips();
  if(gs?.phase==="lobby") B_refreshLobby();
  const vc=document.getElementById("b-votecount-wrap");
  if(vc){ const sub2=gs.subs?.[gs.cIdx]; const others=gs.players.filter(pl=>pl.id!==sub2?.pid); vc.textContent=`${others.filter(pl=>gs.cVotes[pl.id]).length}/${others.length} voted`; }
}
function B_refreshLobby(){
  const lob=document.getElementById("b-players"); if(!lob) return;
  lob.innerHTML=gs.players.map((p,i)=>`<div style="display:flex;align-items:center;gap:12px;padding:12px 0;${i<gs.players.length-1?"border-bottom:1px solid var(--bd)":""}"><span style="font-size:24px">${p.av}</span><span style="font-weight:800;font-size:15px;flex:1">${p.name}${p.id===myId?' <span style="color:var(--mu);font-size:11px">(you)</span>':''}</span>${i===0?'<span style="background:var(--y);color:#000;font-size:10px;font-weight:900;padding:2px 10px;border-radius:20px">HOST</span>':''}</div>`).join("");
  const cnt=document.getElementById("b-playercount"); if(cnt) cnt.textContent=gs.players.length;
}

function bindBlitz(){
  const $=id=>document.getElementById(id);const on=(id,fn)=>{const el=$(id);if(el)el.onclick=fn;};
  on("back-home",()=>{currentGame=null;gs=null;roomCode="";if(stateRefListener&&stateCallback)stateRefListener.off("value",stateCallback);if(statePoller)clearInterval(statePoller);if(actTimer)clearInterval(actTimer);render();});
  on("cbtn",async()=>{myName=$("ni")?.value.trim();if(!myName){toast("Enter your name!","err");return;}$("cbtn").disabled=true;$("cbtn").textContent="Creating…";await B_createRoom();});
  on("jbtn",async()=>{myName=$("ni")?.value.trim();const c=$("ji")?.value.toUpperCase().trim();if(!myName){toast("Enter your name!","err");return;}if(!c||c.length!==4){toast("Need a 4-letter code","err");return;}$("jbtn").disabled=true;$("jbtn").textContent="Joining…";document.getElementById("app").innerHTML=`<div style="text-align:center;padding:80px 20px;color:var(--mu)"><div style="font-size:32px;margin-bottom:12px">🔗</div><div style="font-weight:800;font-size:16px">Joining ${c}…</div></div>`;await B_joinRoom(c);});
  const ni=$("ni");if(ni){ni.onkeydown=e=>{if(e.key==="Enter")$("cbtn")?.click();};setTimeout(()=>ni.focus(),60);}
  const ji=$("ji");if(ji)ji.onkeydown=e=>{if(e.key==="Enter")$("jbtn")?.click();};
  on("sbtn",()=>B_startGame());on("ans-btn",()=>B_submitAnswer());
  on("vok",()=>B_vote("ok"));on("vch",()=>B_vote("ch"));
  on("nbtn",()=>B_nextRound());on("rmbtn",()=>B_rematch());
  const ai=$("ans-inp");if(ai){ai.onkeydown=e=>{if(e.key==="Enter")B_submitAnswer();};setTimeout(()=>ai.focus(),60);}
}

let P_hasSubmitted=false,P_hasVoted=false,P_lastRound=-1;
const P_stRef=()=>db.ref(`${P_ROOT}/${roomCode}/state`);
const P_acRef=()=>db.ref(`${P_ROOT}/${roomCode}/actions`);
const P_myAcRef=()=>db.ref(`${P_ROOT}/${roomCode}/actions/${myId}`);
const P_clean=r=>!r?null:{...r,players:toArr(r.players),answers:toArr(r.answers),votes:r.votes||{},result:r.result||null,usedQs:toArr(r.usedQs)};

function P_pickQ(usedQs){const a=P_QS.filter(q=>!usedQs.includes(q));return a.length>0?a[~~(Math.random()*a.length)]:P_QS[~~(Math.random()*P_QS.length)];}
function P_pickSubject(players,usedIds){const u=players.filter(p=>!usedIds.includes(p.id));const pool=u.length>0?u:players;return pool[~~(Math.random()*pool.length)];}

async function P_createRoom(){
  roomCode=rc();isHost=true;
  gs={phase:"lobby",round:0,total:P_N_RDS,subject:null,question:null,qTemplate:null,answers:[],votes:{},result:null,usedQs:[],usedSubIds:[],submitEnd:null,voteEnd:null,players:[{id:myId,name:myName,av:myAv,score:0}]};
  await P_stRef().set(gs);
  actTimer=setInterval(P_processActions,800);
  listenToState(roomCode,P_ROOT,P_clean);render();
}

async function P_processActions(){
  const snap=await P_acRef().once("value");const acts=snap.val();if(!acts)return;
  let dirty=false;
  for(const[pid,act]of Object.entries(acts)){
    if(!act||!act.type)continue;
    db.ref(`${P_ROOT}/${roomCode}/actions/${pid}`).remove();
    if(act.type==="JOIN"&&!gs.players.find(p=>p.id===pid)){gs.players.push({id:pid,name:act.name,av:act.av,score:0});dirty=true;}
    if(act.type==="SUBMIT"&&gs.phase==="submit"&&!gs.answers.find(a=>a.pid===pid)){
      gs.answers.push({id:uid(),pid,pname:act.name,pav:act.av,text:act.text,isReal:act.isReal||false});dirty=true;
      if(gs.players.every(p=>gs.answers.find(a=>a.pid===p.id))){clearTimeout(window._pSubT);P_startVoting();return;}
    }
    if(act.type==="VOTE"&&gs.phase==="vote"&&!gs.votes[pid]){
      gs.votes[pid]=act.aid;dirty=true;
      if(gs.players.every(p=>gs.votes[p.id])){clearTimeout(window._pVoteT);P_showResult();return;}
    }
  }
  if(dirty){await P_stRef().set(gs);render();}
}

async function P_startRound(){
  const subject=P_pickSubject(gs.players,gs.usedSubIds||[]);
  const qTemplate=P_pickQ(gs.usedQs||[]);
  const question=qTemplate.replace(/\[NAME\]/g,subject.name);
  Object.assign(gs,{phase:"submit",round:gs.round+1,subject:{id:subject.id,name:subject.name,av:subject.av},question,qTemplate,answers:[],votes:{},result:null,submitEnd:ms()+P_SUBMIT_SEC*1000,usedQs:[...(gs.usedQs||[]),qTemplate],usedSubIds:[...(gs.usedSubIds||[]),subject.id]});
  clearTimeout(window._pSubT);window._pSubT=setTimeout(()=>P_startVoting(),P_SUBMIT_SEC*1000);
  await P_stRef().set(gs);render();
}

async function P_startVoting(){
  gs.answers=shuffle(gs.answers);
  Object.assign(gs,{phase:"vote",votes:{},voteEnd:ms()+P_VOTE_SEC*1000});
  clearTimeout(window._pVoteT);window._pVoteT=setTimeout(()=>P_showResult(),P_VOTE_SEC*1000);
  await P_stRef().set(gs);render();
}

async function P_showResult(){
  clearTimeout(window._pSubT);clearTimeout(window._pVoteT);
  const roundPts={};gs.players.forEach(p=>{roundPts[p.id]=0;});
  const fooled={};
  for(const[voterId,aid]of Object.entries(gs.votes)){
    const ans=gs.answers.find(a=>a.id===aid);if(!ans)continue;
    if(!ans.isReal){roundPts[ans.pid]=(roundPts[ans.pid]||0)+500;if(!fooled[aid])fooled[aid]=[];fooled[aid].push(voterId);}
    else{roundPts[voterId]=(roundPts[voterId]||0)+1000;}
  }
  gs.players=gs.players.map(p=>({...p,score:p.score+(roundPts[p.id]||0)}));
  const done=gs.round>=gs.total;
  gs.phase=done?"finished":"result";
  gs.result={roundPts,fooled};
  await P_stRef().set(gs);render();
}

async function P_nextRound(){if(gs.round>=gs.total){gs.phase="finished";await P_stRef().set(gs);render();return;}await P_startRound();}
async function P_rematch(){gs.players=gs.players.map(p=>({...p,score:0}));gs.round=0;gs.usedQs=[];gs.usedSubIds=[];await P_startRound();}

async function P_joinRoom(code){
  roomCode=code;isHost=false;
  const snap=await db.ref(`${P_ROOT}/${code}/state`).once("value");
  if(!snap.exists()){toast("Room not found!","err");roomCode="";render();return;}
  const data=P_clean(snap.val());
  if(data.phase!=="lobby"){toast("Game already started!","err");roomCode="";render();return;}
  gs=data;await P_myAcRef().set({type:"JOIN",name:myName,av:myAv,_ts:ms()});
  listenToState(code,P_ROOT,P_clean);render();
}

async function P_submitAnswer(){
  const inp=document.getElementById("ans-inp");if(!inp||inp.disabled)return;
  const text=inp.value.trim();if(text.length<3){toast("Write something longer!","err");return;}
  inp.disabled=true;const btn=document.getElementById("ans-btn");
  if(btn){btn.disabled=true;btn.textContent="Submitted ✓";}
  P_hasSubmitted=true;
  const isReal=(gs.subject?.id===myId);
  if(isHost){
    if(!gs.answers.find(a=>a.pid===myId)){
      gs.answers.push({id:uid(),pid:myId,pname:myName,pav:myAv,text,isReal});
      if(gs.players.every(p=>gs.answers.find(a=>a.pid===p.id))){clearTimeout(window._pSubT);P_startVoting();}
      else{await P_stRef().set(gs);render();}
    }
  }else{await P_myAcRef().set({type:"SUBMIT",name:myName,av:myAv,text,isReal,_ts:ms()});}
}

async function P_castVote(aid){
  if(P_hasVoted)return;
  const myAns=gs.answers.find(a=>a.pid===myId);
  if(myAns&&myAns.id===aid){toast("Can't vote for your own answer!","err");return;}
  P_hasVoted=true;
  document.querySelectorAll(".ans-card").forEach(el=>el.classList.add("locked"));
  document.querySelector(`[data-aid="${aid}"]`)?.classList.add("selected");
  if(isHost){
    gs.votes[myId]=aid;
    if(gs.players.every(p=>gs.votes[p.id])){clearTimeout(window._pVoteT);P_showResult();}
    else{await P_stRef().set(gs);render();}
  }else{await P_myAcRef().set({type:"VOTE",aid,_ts:ms()});}
}

function P_scrResult(){
  const result=gs.result||{};const roundPts=result.roundPts||{};const fooled=result.fooled||{};
  const myRoundPts=roundPts[myId]||0;
  setTimeout(()=>{try{if(myRoundPts>0)playSfx(myRoundPts>=1000?'win':'fool');}catch(e){}},200);

  }).join("");
  const gotYou=[];
  for(const[aid,voterIds]of Object.entries(fooled)){

d →"}</button>`:`<div style="text-align:center;color:var(--mu);font-size:14px;padding:14px"><span class="blink">⏳</span> Waiting for host…</div>`}</div>`;}

function P_scrFinished(){

let P_screenSig=null;

function renderPsych(){
  clearInterval(displayTimer);
  const app=document.getElementById("app");if(!app)return;
  const p=gs?.phase||"";
  try{
    const myAnswered = !!(gs?.answers||[]).find(a=>a.pid===myId);
    const myVoted = !!(gs?.votes||{})[myId];
    const sig = !gs||!roomCode ? "setup"
      : `${p}|${gs.round}|${p==="vote"?(gs.answers||[]).length:0}|${myAnswered}|${myVoted}`;
    if(sig===P_screenSig && (p==="submit"||p==="vote"||p==="lobby")){
      P_patch();
      if(p==="submit"||p==="vote"){ syncLocal(); P_startDisplay(); }
      return;
    }
    P_screenSig=sig;

    if(!gs||!roomCode)        app.innerHTML=P_scrSetup();
    else if(p==="lobby")      app.innerHTML=P_scrLobby();
    else if(p==="submit")    {app.innerHTML=P_scrSubmit();  syncLocal();P_startDisplay();}
    else if(p==="vote")      {app.innerHTML=P_scrVote();    syncLocal();P_startDisplay();}
    else if(p==="result")     app.innerHTML=P_scrResult();
    else if(p==="finished")   app.innerHTML=P_scrFinished();
    bindPsych();
  }catch(e){console.error("psych render err",e);}
}

// Refresh only the dynamic parts of the current Psych screen (no rebuild)
function P_patch(){

  const subc=document.getElementById("p-subcount");

// ═══════════════════════════════════════════════════════
// DRAW GAME (PICTIONARY)
// ═══════════════════════════════════════════════════════
const D_ROOT = "draw_v1";
const D_DRAW_SEC = 90;
const D_CY = "#06B6D4"; // teal accent for this game

const D_WORDS = [
  // Animals
  "cat","dog","fish","bird","snake","lion","elephant","monkey","penguin","frog",
  "horse","cow","pig","rabbit","duck","bear","shark","turtle","butterfly","giraffe",
  "zebra","crab","octopus","owl","parrot","wolf","whale","bee","fox","dragon",
  // Food
  "pizza","cake","burger","banana","apple","ice cream","sandwich","cookie","donut",
  "taco","popcorn","watermelon","strawberry","lollipop","sushi","hotdog","carrot","grapes",
  // Objects
  "chair","table","clock","phone","book","umbrella","guitar","balloon","camera","bicycle",
  "car","boat","plane","train","rocket","house","castle","tent","key","crown",
  "ring","candle","diamond","trophy","ladder","bridge","lighthouse","sunglasses","hat",
  // Nature
  "sun","moon","star","cloud","rain","rainbow","mountain","tree","flower","beach",
  "fire","wave","snowman","lightning","volcano","island","cactus","mushroom","leaf",
  // Actions / concepts
  "swimming","dancing","sleeping","running","jumping","flying","ghost","heart","eye","hand",
  "smile","crying","thinking","reading","cooking","painting","skateboard","surfing","yoga"
];

let D_isDrawer = false;
let D_hasGuessed = false;
let D_lastRound = -1;
let D_localStrokes = [];
let D_liveStroke = null;
let D_drawing = false;
let D_color = "#000000";
let D_brushWidth = 4;
let D_canvasListener = null;
let D_canvasPoller = null;
let D_drawTimer = null;
let D_flushInterval = null;
let D_dirty = false;

const D_stRef  = () => db.ref(`${D_ROOT}/${roomCode}/state`);
const D_acRef  = () => db.ref(`${D_ROOT}/${roomCode}/actions`);
const D_myAcRef= () => db.ref(`${D_ROOT}/${roomCode}/actions/${myId}`);
const D_cvRef  = () => db.ref(`${D_ROOT}/${roomCode}/canvas`);
const D_clean  = r => !r ? null : {...r,
  players:      toArr(r.players),
  recentGuesses:toArr(r.recentGuesses),
  usedDrawerIds:toArr(r.usedDrawerIds)
};

// ── HOST ──────────────────────────────────────────────────────────
async function D_createRoom(){
  roomCode=rc(); isHost=true;
  gs={ phase:"lobby", round:0, total:0,
       drawerId:null, drawerName:null, drawerAv:null,
       word:null, drawStart:null,
       recentGuesses:[], winner:null, roundPts:{},
       usedDrawerIds:[], players:[{id:myId,name:myName,av:myAv,score:0}] };
  await D_stRef().set(gs);
  if(actTimer) clearInterval(actTimer);
  actTimer = setInterval(D_processActions, 600);
  listenToState(roomCode, D_ROOT, D_clean);
  render();
}

async function D_processActions(){
  const snap = await D_acRef().once("value");
  const acts = snap.val(); if(!acts) return;
  let dirty = false;
  for(const [pid,act] of Object.entries(acts)){
    if(!act||!act.type) continue;
    db.ref(`${D_ROOT}/${roomCode}/actions/${pid}`).remove();
    if(act.type==="JOIN" && !gs.players.find(p=>p.id===pid)){
      gs.players.push({id:pid,name:act.name,av:act.av,score:0}); dirty=true;
    }
    if(act.type==="GUESS" && gs.phase==="draw" && gs.drawerId!==pid){
      const guess = act.text.trim().toLowerCase();
      const word  = (gs.word||"").toLowerCase();
      const rg    = [...(gs.recentGuesses||[]), {pid,pname:act.name,pav:act.av,text:act.text,ts:ms()}].slice(-5);
      gs.recentGuesses = rg; dirty=true;
      if(guess===word){
        // Correct! Award points
        const elapsed = (ms()-gs.drawStart)/1000;
        const speedBonus = elapsed<30?100:0;
        gs.roundPts = {};
        gs.roundPts[pid] = 300 + speedBonus;        // guesser
        gs.roundPts[gs.drawerId] = 200;             // drawer
        gs.players = gs.players.map(p=>({...p, score:p.score+(gs.roundPts[p.id]||0)}));
        gs.winner = {id:pid, name:act.name, av:act.av, guess:act.text};
        const done = gs.usedDrawerIds.length >= gs.players.length;
        gs.phase = done ? "finished" : "result";
        clearTimeout(D_drawTimer);
        dirty=true;
      }
    }
  }
  if(dirty){ await D_stRef().set(gs); render(); }
}

async function D_startGame(){
  gs.total = gs.players.length; // each player draws once
  await D_startRound();
}

async function D_startRound(){
  // clear old canvas
  await D_cvRef().remove();
  // pick drawer
  const unused = gs.players.filter(p=>!gs.usedDrawerIds.includes(p.id));
  const drawer = unused.length>0 ? unused[~~(Math.random()*unused.length)] : gs.players[~~(Math.random()*gs.players.length)];
  // pick word
  const word = D_WORDS[~~(Math.random()*D_WORDS.length)];
  gs.round++;
  gs.drawerId     = drawer.id;
  gs.drawerName   = drawer.name;
  gs.drawerAv     = drawer.av;
  gs.word         = word;
  gs.drawStart    = ms();
  gs.phase        = "draw";
  gs.recentGuesses= [];
  gs.winner       = null;
  gs.roundPts     = {};
  gs.usedDrawerIds= [...(gs.usedDrawerIds||[]), drawer.id];
  clearTimeout(D_drawTimer);
  D_drawTimer = setTimeout(()=>D_endRound(), D_DRAW_SEC*1000);
  await D_stRef().set(gs);
  render();
}

async function D_endRound(){
  clearTimeout(D_drawTimer);
  if(gs.phase!=="draw") return;
  const done = gs.usedDrawerIds.length >= gs.players.length;
  gs.phase = done ? "finished" : "result";
  gs.winner = null; gs.roundPts = {};
  await D_stRef().set(gs); render();
}

async function D_nextRound(){
  if(gs.usedDrawerIds.length>=gs.players.length){ gs.phase="finished"; await D_stRef().set(gs); render(); return; }
  await D_startRound();
}

async function D_rematch(){
  gs.players=gs.players.map(p=>({...p,score:0}));
  gs.round=0; gs.usedDrawerIds=[];
  await D_cvRef().remove();
  await D_startRound();
}

// ── PLAYER JOIN ───────────────────────────────────────────────────
async function D_joinRoom(code){
  roomCode=code; isHost=false;
  const snap = await db.ref(`${D_ROOT}/${code}/state`).once("value");
  if(!snap.exists()){ toast("Room not found!","err"); roomCode=""; render(); return; }
  const data = D_clean(snap.val());
  if(data.phase!=="lobby"){ toast("Game already started!","err"); roomCode=""; render(); return; }
  gs=data;
  await D_myAcRef().set({type:"JOIN",name:myName,av:myAv,_ts:ms()});
  listenToState(code, D_ROOT, D_clean);
  render();
}

// ── CANVAS SYNC ───────────────────────────────────────────────────
function D_startCanvasSync(code){
  // Stop old listeners
  if(D_canvasListener) D_canvasListener.off("value");
  if(D_canvasPoller)   clearInterval(D_canvasPoller);
  if(D_flushInterval)  clearInterval(D_flushInterval);

  if(D_isDrawer){
    // Flush local strokes to Firebase every 100ms
    D_flushInterval = setInterval(()=>{
      if(!D_dirty) return;
      D_dirty = false;
      D_cvRef().set({strokes:D_localStrokes, live:D_liveStroke||null});
    },100);
  } else {
    // Viewers: listen + poll
    D_canvasListener = D_cvRef();
    D_canvasListener.on("value", snap=>{
      const data = snap.val(); if(!data) return;
      D_renderFromData(data.strokes, data.live);
    });
    D_canvasPoller = setInterval(async()=>{
      const snap = await D_cvRef().once("value");
      const data = snap.val(); if(!data) return;
      D_renderFromData(data.strokes, data.live);
    },800);
  }
}

function D_stopCanvasSync(){
  if(D_canvasListener){ D_canvasListener.off("value"); D_canvasListener=null; }
  if(D_canvasPoller)  { clearInterval(D_canvasPoller);  D_canvasPoller=null;  }
  if(D_flushInterval) { clearInterval(D_flushInterval); D_flushInterval=null; }
}

function D_renderFromData(strokes, live){
  const cv = document.getElementById("draw-canvas"); if(!cv) return;
  const ctx = cv.getContext("2d");
  ctx.clearRect(0,0,cv.width,cv.height);
  ctx.fillStyle="#ffffff"; ctx.fillRect(0,0,cv.width,cv.height);
  const all = [...(strokes||[])];
  if(live) all.push(live);
  all.forEach(s=>{ if(!s||!s.pts||s.pts.length<2) return;
    ctx.beginPath(); ctx.strokeStyle=s.color||"#000"; ctx.lineWidth=s.width||4;
    ctx.lineCap="round"; ctx.lineJoin="round";
    ctx.moveTo(s.pts[0].x,s.pts[0].y);
    s.pts.slice(1).forEach(p=>ctx.lineTo(p.x,p.y));
    ctx.stroke();
  });
}

// ── CANVAS INPUT ──────────────────────────────────────────────────
function D_initCanvas(){
  const cv = document.getElementById("draw-canvas"); if(!cv||!D_isDrawer) return;
  const ctx = cv.getContext("2d");
  ctx.clearRect(0,0,cv.width,cv.height);
  ctx.fillStyle="#ffffff"; ctx.fillRect(0,0,cv.width,cv.height);
  D_localStrokes=[]; D_liveStroke=null; D_drawing=false; D_dirty=true;

  function getPos(e){
    const r=cv.getBoundingClientRect(), sx=cv.width/r.width, sy=cv.height/r.height;
    const src=e.touches?e.touches[0]:e;
    return {x:(src.clientX-r.left)*sx, y:(src.clientY-r.top)*sy};
  }
  function down(e){ e.preventDefault(); D_drawing=true;
    const p=getPos(e); D_liveStroke={pts:[p],color:D_color,width:D_brushWidth};
    ctx.beginPath(); ctx.moveTo(p.x,p.y); D_dirty=true;
  }
  function move(e){ if(!D_drawing) return; e.preventDefault();
    const p=getPos(e); D_liveStroke.pts.push(p);
    ctx.strokeStyle=D_color; ctx.lineWidth=D_brushWidth;
    ctx.lineCap="round"; ctx.lineJoin="round";
    const pts=D_liveStroke.pts; const last=pts[pts.length-2];
    if(last){ ctx.beginPath(); ctx.moveTo(last.x,last.y); ctx.lineTo(p.x,p.y); ctx.stroke(); }
    D_dirty=true;
  }
  function up(e){ if(!D_drawing) return; D_drawing=false;
    if(D_liveStroke&&D_liveStroke.pts.length>1){
      D_localStrokes.push({...D_liveStroke}); D_liveStroke=null; D_dirty=true;
    }
  }
  cv.addEventListener("mousedown",down); cv.addEventListener("mousemove",move);
  cv.addEventListener("mouseup",up);     cv.addEventListener("mouseleave",up);
  cv.addEventListener("touchstart",down,{passive:false});
  cv.addEventListener("touchmove",move,{passive:false});
  cv.addEventListener("touchend",up);
}

function D_setColor(c){
  D_color=c;
  document.querySelectorAll(".d-color").forEach(el=>el.style.outline=(el.dataset.c===c)?"3px solid #fff":"2px solid transparent");
}
function D_setWidth(w){
  D_brushWidth=w;
  document.querySelectorAll(".d-size").forEach(el=>el.style.outline=(el.dataset.w==w)?"3px solid #fff":"2px solid transparent");
}
function D_clearCanvas(){
  const cv=document.getElementById("draw-canvas"); if(!cv) return;
  const ctx=cv.getContext("2d");
  ctx.clearRect(0,0,cv.width,cv.height);
  ctx.fillStyle="#ffffff"; ctx.fillRect(0,0,cv.width,cv.height);
  D_localStrokes=[]; D_liveStroke=null; D_dirty=true;
}

async function D_submitGuess(){
  const inp=document.getElementById("guess-inp"); if(!inp||inp.disabled) return;
  const text=inp.value.trim(); if(!text){ return; }
  inp.value="";
  if(isHost){ // host processes locally
    const guess=text.toLowerCase(); const word=(gs.word||"").toLowerCase();
    const rg=[...(gs.recentGuesses||[]),{pid:myId,pname:myName,pav:myAv,text,ts:ms()}].slice(-5);
    gs.recentGuesses=rg;
    if(guess===word){
      const elapsed=(ms()-gs.drawStart)/1000;
      const speedBonus=elapsed<30?100:0;
      gs.roundPts={}; gs.roundPts[myId]=300+speedBonus; gs.roundPts[gs.drawerId]=200;
      gs.players=gs.players.map(p=>({...p,score:p.score+(gs.roundPts[p.id]||0)}));
      gs.winner={id:myId,name:myName,av:myAv,guess:text};
      const done=gs.usedDrawerIds.length>=gs.players.length;
      gs.phase=done?"finished":"result"; clearTimeout(D_drawTimer);
    }
    await D_stRef().set(gs); render();
  } else {
    await D_myAcRef().set({type:"GUESS",name:myName,av:myAv,text,_ts:ms()});
  }
}

// ── RENDER & BIND ─────────────────────────────────────────────────
function D_startTimer(){
  clearInterval(displayTimer);
  displayTimer=setInterval(()=>{
    if(!gs||gs.phase!=="draw"||!gs.drawStart) return;
    const left=Math.max(0,D_DRAW_SEC-(ms()-gs.drawStart)/1000);
    const s=Math.ceil(left), col=s<=10?"var(--pk)":s<=20?"var(--y)":"var(--gr)";
    const el=document.getElementById("d-timer");
    if(el){el.textContent=s;el.style.color=col;}
  },250);
}

let D_drawScreenKey=null; // tracks which round/drawer the draw screen is built for
let D_lobbySig=null; // guards draw lobby against rebuild-flicker

function renderDraw(){
  clearInterval(displayTimer);
  const app=document.getElementById("app"); if(!app) return;
  const p=gs?.phase||"";
  try{
    if(!gs||!roomCode)     { D_stopCanvasSync(); D_drawScreenKey=null; D_lobbySig=null; app.innerHTML=D_scrSetup(); bindDraw(); }
    else if(p==="lobby")   {
      D_stopCanvasSync(); D_drawScreenKey=null;
      if(D_lobbySig==="lobby"){ D_refreshLobby(); }  // just add the new player, no flicker
      else { D_lobbySig="lobby"; app.innerHTML=D_scrLobby(); bindDraw(); }
    }
    else if(p==="draw")    {
      D_lobbySig=null;
      D_isDrawer=(gs.drawerId===myId);
      const key=`${gs.round}:${gs.drawerId}`;
      if(D_drawScreenKey!==key){
        // New round — this is the ONLY time the canvas is rebuilt
        D_drawScreenKey=key;
        D_stopCanvasSync();
        app.innerHTML=D_scrDraw();
        bindDraw();
        D_startCanvasSync(roomCode);
        if(D_isDrawer) setTimeout(()=>D_initCanvas(),50);
      } else {
        // Same round, just a state update (e.g. a wrong guess) — patch dynamic
        // parts only, leave the canvas DOM element and the drawing untouched
        D_patchDrawScreen();
      }
      D_startTimer();
    }
    else if(p==="result")  { D_stopCanvasSync(); D_drawScreenKey=null; D_lobbySig=null; app.innerHTML=D_scrResult(); bindDraw(); }
    else if(p==="finished"){ D_stopCanvasSync(); D_drawScreenKey=null; D_lobbySig=null; app.innerHTML=D_scrFinished(); bindDraw(); }
  }catch(e){console.error("draw render err",e);}
}

// Update only the live regions of the draw screen without touching the canvas
function D_patchDrawScreen(){
  const rgWrap=document.getElementById("d-guesses");
  if(rgWrap){
    const recent=(gs.recentGuesses||[]).slice(-4).reverse();
    rgWrap.innerHTML = recent.length>0
      ? `<span class="lbl" style="margin-bottom:6px">Recent Guesses</span>`+
        recent.map(g=>`<div style="font-size:13px;font-weight:700;color:var(--mu);padding:2px 0">${g.pav} ${g.pname}: <span style="color:var(--te)">${g.text}</span></div>`).join("")
      : "";
    rgWrap.style.display = recent.length>0 ? "block" : "none";
  }
  const scWrap=document.getElementById("d-scores");
  if(scWrap) scWrap.innerHTML=D_chips();
}

// Refresh draw lobby players without a full rebuild (no flicker on join)

  const lob=document.getElementById("d-players"); if(!lob) return;
  lob.innerHTML=gs.players.map((p,i)=>`<div style="display:flex;align-items:center;gap:12px;padding:12px 0;${i<gs.players.length-1?"border-bottom:1px solid var(--bd)":""}"><span style="font-size:24px">${p.av}</span><span style="font-weight:800;font-size:15px;flex:1">${p.name}${p.id===myId?' <span style="color:var(--mu);font-size:11px">(you)</span>':''}</span>${i===0?'<span style="background:#06B6D4;color:#000;font-size:10px;font-weight:900;padding:2px 10px;border-radius:20px">HOST</span>':''}</div>`).join("");
  const cnt=document.getElementById("d-playercount"); if(cnt) cnt.textContent=gs.players.length;
  const rc=document.getElementById("d-roundcount"); if(rc) rc.textContent=gs.players.length;

function bindDraw(){
  const $=id=>document.getElementById(id);
  const on=(id,fn)=>{const el=$(id);if(el)el.onclick=fn;};
  on("back-home",()=>{
    currentGame=null;gs=null;roomCode="";
    D_stopCanvasSync();
    if(stateRefListener&&stateCallback)stateRefListener.off("value",stateCallback);
    if(statePoller)clearInterval(statePoller);
    if(actTimer)clearInterval(actTimer);
    clearTimeout(D_drawTimer);
    render();
  });
  on("cbtn",async()=>{myName=$("ni")?.value.trim();if(!myName){toast("Enter your name!","err");return;}$("cbtn").disabled=true;$("cbtn").textContent="Creating…";await D_createRoom();});
  on("jbtn",async()=>{
    myName=$("ni")?.value.trim();const c=$("ji")?.value.toUpperCase().trim();
    if(!myName){toast("Enter your name!","err");return;}
    if(!c||c.length!==4){toast("Need a 4-letter code","err");return;}
    $("jbtn").disabled=true;$("jbtn").textContent="Joining…";
    document.getElementById("app").innerHTML=`<div style="text-align:center;padding:80px 20px;color:var(--mu)"><div style="font-size:32px;margin-bottom:12px">🔗</div><div style="font-weight:800;font-size:16px">Joining ${c}…</div></div>`;
    await D_joinRoom(c);
  });
  const ni=$("ni");if(ni){ni.onkeydown=e=>{if(e.key==="Enter")$("cbtn")?.click();};setTimeout(()=>ni.focus(),60);}
  const ji=$("ji");if(ji)ji.onkeydown=e=>{if(e.key==="Enter")$("jbtn")?.click();};
  on("sbtn",()=>D_startGame());
  on("nbtn",()=>D_nextRound());
  on("rmbtn",()=>D_rematch());

// TYPE GAME (SINGLE-PLAYER TYPING TEST)
// ═══════════════════════════════════════════════════════
const TYPE_WORDS = ("the of to and a in is it you that he was for on are with as his they at be this from i have or by one had not but what all were when we there can an your which their said if do will each about how up out them then she many some so these would other into has more her two like him see time could no make than first been its who now people my made over did down only way find use may water long little very after words called just where most know get through back much before go good new write our used me man too any day same right look think also around another came come work three word must because does part even place well such here take why things help put years different away again off went old number great tell men say small every found still between name should home big give air line set own under read last never us left end along while might next sound below saw something thought both few those always looked show large often together asked house don't world going want school important until form food keep children feet land side without boy once animal life enough took sometimes four head above kind began almost live page got earth need far hand high year mother light country father let night picture being study second eyes soon times story boy since white days ever paper hard near sentence better best across during today others however sure means knew it's").split(" ");

let TYPE_mode="time", TYPE_modeVal=30;
let TYPE_queue=[], TYPE_typed="", TYPE_target="";
let TYPE_started=false, TYPE_finished=false, TYPE_startTime=0;
let TYPE_correctChars=0, TYPE_incorrectChars=0, TYPE_totalKeys=0;
let TYPE_wpmSeries=[], TYPE_rawSeries=[], TYPE_errSeries=[];
let TYPE_lastSampleSec=0, TYPE_keysSinceSample=0, TYPE_errsSinceSample=0, TYPE_correctSinceSample=0;
let TYPE_rafId=null, TYPE_scrollOffset=0;
let TYPE_wrongMap={};

const TYPE_MODES=[
  {mode:"time",  val:30,  label:"30s"},
  {mode:"time",  val:60,  label:"60s"},
  {mode:"time",  val:300, label:"5 min"},
  {mode:"words", val:50,  label:"50 words"},
  {mode:"words", val:100, label:"100 words"},
];

function TYPE_buildWords(n){
  let out=[];
  for(let i=0;i<n;i++) out.push(TYPE_WORDS[(Math.random()*TYPE_WORDS.length)|0]);
  return out;
}

function TYPE_letterEl(i){ const wi=document.getElementById("type-inner"); return wi?wi.querySelector(`.tl[data-i="${i}"]`):null; }

function TYPE_renderWords(){
  let html="", pos=0;
  for(let w=0; w<TYPE_queue.length; w++){
    html += `<div class="tw" data-w="${w}">`;
    for(let c=0;c<TYPE_queue[w].length;c++){
      html += `<span class="tl" data-i="${pos}">${TYPE_queue[w][c]}</span>`;
      pos++;
    }
    html += `</div>`;
    if(w<TYPE_queue.length-1){
      html += `<span class="tl tsp" data-i="${pos}">&nbsp;</span>`;
      pos++;
    }
  }
  const wi=document.getElementById("type-inner");
  if(wi) wi.innerHTML=html;
}

// cursor placement using getBoundingClientRect (transform-safe, no jump on spaces)
function TYPE_updateCursor(){
  const cur=document.getElementById("type-cursor");
  const inner=document.getElementById("type-inner");
  if(!cur||!inner) return;

  const ci=Math.min(TYPE_typed.length, TYPE_target.length);
  let el=TYPE_letterEl(ci), atEnd=false;
  if(!el){ el=TYPE_letterEl(TYPE_target.length-1); atEnd=true; }
  if(!el) return;

  // offsetLeft / offsetTop are measured relative to the offset parent (#type-inner)
  // and are COMPLETELY INDEPENDENT of the CSS transform we apply for scrolling.
  // This means they never jitter mid-scroll — the source of the page-jump bug.
  const LINE_H = TYPE_lineHeight();
  let left, topRelInner;

  if(el.classList.contains("tsp") && !atEnd){
    // cursor rests just after the last letter of the word before the space,
    // so it flows naturally instead of jumping to the zero-width space box
    const prev=TYPE_letterEl(ci-1);
    if(prev){ left=prev.offsetLeft+prev.offsetWidth; topRelInner=prev.offsetTop; }
    else { left=el.offsetLeft; topRelInner=el.offsetTop; }
  } else {
    left=el.offsetLeft + (atEnd?el.offsetWidth:0);
    topRelInner=el.offsetTop;
  }

  // which line is the cursor on (0-indexed) within the un-scrolled content
  const lineIdx=Math.round(topRelInner/LINE_H);
  // keep the active line pinned to the 2nd visible row; scroll in whole-line steps
  const desiredOffset=Math.max(0,(lineIdx-1))*LINE_H;
  if(desiredOffset!==TYPE_scrollOffset){
    TYPE_scrollOffset=desiredOffset;
    inner.style.transform=`translateY(${-TYPE_scrollOffset}px)`;
  }

  cur.style.left=left+"px";
  cur.style.top=(topRelInner - TYPE_scrollOffset + 8)+"px";
  cur.classList.add("typing");
  clearTimeout(window._typeCt);
  window._typeCt=setTimeout(()=>cur.classList.remove("typing"),500);
}

// read the actual line height from CSS so cursor math matches rendering exactly
function TYPE_lineHeight(){
  const wordsEl=document.getElementById("type-words");
  if(!wordsEl) return 56;
  const lh=parseFloat(getComputedStyle(wordsEl).lineHeight);
  return isNaN(lh)?56:lh;
}

function TYPE_refreshLetters(){
  const n=TYPE_target.length;
  let corr=0, inc=0;
  for(let i=0;i<n;i++){
    const el=TYPE_letterEl(i);
    if(!el) continue;
    const isSp=el.classList.contains("tsp");
    if(i<TYPE_typed.length){
      if(TYPE_typed[i]===TYPE_target[i]){ el.className=isSp?"tl tsp correct":"tl correct"; corr++; }
      else { el.className=isSp?"tl tsp wrong":"tl wrong"; inc++; }
    } else {
      el.className=isSp?"tl tsp":"tl";
    }
  }
  TYPE_correctChars=corr; TYPE_incorrectChars=inc;
  TYPE_updateCursor();
}

function TYPE_newTest(){
  TYPE_finished=false; TYPE_started=false;
  TYPE_typed=""; TYPE_startTime=0;
  TYPE_correctChars=TYPE_incorrectChars=TYPE_totalKeys=0;
  TYPE_wpmSeries=[]; TYPE_rawSeries=[]; TYPE_errSeries=[];
  TYPE_lastSampleSec=0; TYPE_keysSinceSample=0; TYPE_errsSinceSample=0; TYPE_correctSinceSample=0;
  TYPE_scrollOffset=0; TYPE_wrongMap={};
  if(TYPE_rafId){ cancelAnimationFrame(TYPE_rafId); TYPE_rafId=null; }

  // time mode: generate enough words to never run out (5 min at 120wpm ≈ 600 words)
  const count = TYPE_mode==="words" ? TYPE_modeVal : (TYPE_modeVal>=300 ? 700 : 200);
  TYPE_queue=TYPE_buildWords(count);
  TYPE_target=TYPE_queue.join(" ");
  TYPE_renderWords();
  const inner=document.getElementById("type-inner");
  if(inner) inner.style.transform="translateY(0px)";
  const res=document.getElementById("type-results"); if(res) res.classList.remove("show");
  const stage=document.getElementById("type-stage"); if(stage) stage.style.display="";
  const live=document.getElementById("type-live"); if(live) live.classList.remove("show");
  const lw=document.getElementById("type-livewpm"); if(lw) lw.textContent="0";
  const lt=document.getElementById("type-livetimer");
  if(lt) lt.textContent = TYPE_mode==="time" ? TYPE_fmtTime(TYPE_modeVal) : "";
  requestAnimationFrame(()=>TYPE_updateCursor());
  TYPE_focus();
}

function TYPE_fmtTime(s){
  if(s>=60){ const m=Math.floor(s/60), ss=s%60; return ss>0?`${m}:${String(ss).padStart(2,"0")}`:`${m}:00`; }
  return s+"s";
}

function TYPE_focus(){ const h=document.getElementById("type-hidden"); if(h) h.focus({preventScroll:true}); }

function TYPE_onKey(e){
  if(e.key==="Tab"){ e.preventDefault(); window._typeTabbed=true; setTimeout(()=>window._typeTabbed=false,600); return; }
  if(e.key==="Enter"){
    if(window._typeTabbed || TYPE_finished){ e.preventDefault(); TYPE_newTest(); return; }
  }
  if(TYPE_finished) return;
  if(e.key==="Backspace"){
    e.preventDefault();
    if(TYPE_typed.length>0){ TYPE_typed=TYPE_typed.slice(0,-1); TYPE_refreshLetters(); }
    return;
  }
  if(e.key.length!==1) return;
  e.preventDefault();
  if(!TYPE_started) TYPE_startRun();
  TYPE_typed+=e.key;
  TYPE_totalKeys++; TYPE_keysSinceSample++;
  const expected=TYPE_target[TYPE_typed.length-1];
  if(e.key===expected) TYPE_correctSinceSample++;
  else TYPE_errsSinceSample++;
  TYPE_refreshLetters();
  if(TYPE_mode==="words" && TYPE_typed.length>=TYPE_target.length) TYPE_finishRun();
}

function TYPE_startRun(){
  TYPE_started=true;
  TYPE_startTime=performance.now();
  TYPE_lastSampleSec=0;
  const live=document.getElementById("type-live"); if(live) live.classList.add("show");
  TYPE_loop(TYPE_startTime);
}

function TYPE_loop(now){
  const elapsed=(now-TYPE_startTime)/1000;
  const mins=elapsed/60;
  const liveWpm = mins>0 ? Math.round((TYPE_correctChars/5)/mins) : 0;
  const lw=document.getElementById("type-livewpm"); if(lw) lw.textContent=liveWpm;

  const sec=Math.floor(elapsed);
  if(sec>TYPE_lastSampleSec){
    for(let s=TYPE_lastSampleSec;s<sec;s++){
      const wpmInst=TYPE_keysSinceSample>0?Math.round((TYPE_correctSinceSample/5)*60):(TYPE_wpmSeries.length?TYPE_wpmSeries[TYPE_wpmSeries.length-1]:0);
      TYPE_wpmSeries.push(Math.max(0,wpmInst));
      TYPE_rawSeries.push(Math.max(0,Math.round((TYPE_keysSinceSample/5)*60)));
      TYPE_errSeries.push(TYPE_errsSinceSample);
      TYPE_keysSinceSample=0; TYPE_correctSinceSample=0; TYPE_errsSinceSample=0;
    }
    TYPE_lastSampleSec=sec;
  }

  if(TYPE_mode==="time"){
    const remain=Math.max(0, TYPE_modeVal-elapsed);
    const lt=document.getElementById("type-livetimer"); if(lt) lt.textContent=TYPE_fmtTime(Math.ceil(remain));
    if(remain<=0){ TYPE_finishRun(); return; }
  }
  if(!TYPE_finished) TYPE_rafId=requestAnimationFrame(TYPE_loop);
}

function TYPE_finishRun(){
  if(TYPE_finished) return;
  TYPE_finished=true;
  if(TYPE_rafId){ cancelAnimationFrame(TYPE_rafId); TYPE_rafId=null; }
  const elapsed=(performance.now()-TYPE_startTime)/1000 || 0.001;
  if(TYPE_keysSinceSample>0){
    const wpmInst=Math.round((TYPE_correctSinceSample/5)*60);
    TYPE_wpmSeries.push(Math.max(0,wpmInst));
    TYPE_rawSeries.push(Math.max(0,Math.round((TYPE_keysSinceSample/5)*60)));
    TYPE_errSeries.push(TYPE_errsSinceSample);
  }
  if(TYPE_wpmSeries.length===0){ TYPE_wpmSeries=[0]; TYPE_rawSeries=[0]; TYPE_errSeries=[0]; }

  const mins=elapsed/60;
  const netWpm=Math.round((TYPE_correctChars/5)/mins);
  const rawWpm=Math.round(((TYPE_correctChars+TYPE_incorrectChars)/5)/mins);
  const acc=TYPE_totalKeys>0?Math.round((TYPE_correctChars/(TYPE_correctChars+TYPE_incorrectChars||1))*100):100;
  const mean=TYPE_wpmSeries.reduce((a,b)=>a+b,0)/TYPE_wpmSeries.length;
  const variance=TYPE_wpmSeries.reduce((a,b)=>a+(b-mean)**2,0)/TYPE_wpmSeries.length;
  const cv=mean>0?Math.sqrt(variance)/mean:0;
  const consistency=Math.max(0,Math.round((1-cv)*100));

  document.getElementById("type-rwpm").textContent=netWpm;
  document.getElementById("type-racc").innerHTML=acc+'<small>%</small>';
  document.getElementById("type-rraw").textContent=rawWpm;
  document.getElementById("type-rchars").textContent=`${TYPE_correctChars}/${TYPE_incorrectChars}`;
  document.getElementById("type-rcons").textContent=consistency+"%";
  document.getElementById("type-rtime").textContent=Math.round(elapsed)+"s";

  document.getElementById("type-stage").style.display="none";
  document.getElementById("type-results").classList.add("show");
  TYPE_drawGraph();
}

function TYPE_drawGraph(){
  const cv=document.getElementById("type-graph");
  const wrap=document.getElementById("type-graphwrap");
  if(!cv||!wrap) return;
  const dpr=window.devicePixelRatio||1;
  const W=wrap.clientWidth, H=wrap.clientHeight;
  cv.width=W*dpr; cv.height=H*dpr; cv.style.width=W+"px"; cv.style.height=H+"px";
  const ctx=cv.getContext("2d"); ctx.scale(dpr,dpr); ctx.clearRect(0,0,W,H);
  const pad={l:34,r:10,t:14,b:22}, gw=W-pad.l-pad.r, gh=H-pad.t-pad.b;
  const n=TYPE_wpmSeries.length;
  const maxWpm=Math.max(40, ...TYPE_rawSeries, ...TYPE_wpmSeries)*1.1;
  ctx.strokeStyle="#22262c"; ctx.lineWidth=1;
  ctx.fillStyle="#4a5058"; ctx.font="10px 'JetBrains Mono', monospace"; ctx.textAlign="right";
  for(let g=0;g<=2;g++){
    const val=Math.round(maxWpm/2*g), y=pad.t+gh-(val/maxWpm)*gh;
    ctx.beginPath(); ctx.moveTo(pad.l,y); ctx.lineTo(W-pad.r,y); ctx.stroke();
    ctx.fillText(val, pad.l-6, y+3);
  }
  const xAt=i=> n<=1 ? pad.l+gw/2 : pad.l+(i/(n-1))*gw;
  const yAt=v=> pad.t+gh-(Math.min(v,maxWpm)/maxWpm)*gh;
  ctx.strokeStyle="#3a3f47"; ctx.lineWidth=1.5; ctx.beginPath();
  TYPE_rawSeries.forEach((v,i)=>{ const x=xAt(i),y=yAt(v); i?ctx.lineTo(x,y):ctx.moveTo(x,y); }); ctx.stroke();
  ctx.strokeStyle="#e2b714"; ctx.lineWidth=2.5; ctx.lineJoin="round"; ctx.beginPath();
  TYPE_wpmSeries.forEach((v,i)=>{ const x=xAt(i),y=yAt(v); i?ctx.lineTo(x,y):ctx.moveTo(x,y); }); ctx.stroke();
  ctx.fillStyle="#e2b714";
  TYPE_wpmSeries.forEach((v,i)=>{ ctx.beginPath(); ctx.arc(xAt(i),yAt(v),2.5,0,7); ctx.fill(); });
  ctx.fillStyle="#ca4754";
  TYPE_errSeries.forEach((e,i)=>{ if(e>0){ ctx.beginPath(); ctx.arc(xAt(i),pad.t+4,2.5,0,7); ctx.fill(); }});
  ctx.fillStyle="#4a5058"; ctx.textAlign="center"; ctx.fillText("time (s)", pad.l+gw/2, H-6);
  ctx.textAlign="left";
  ctx.fillStyle="#e2b714"; ctx.fillText("● wpm", W-pad.r-96, pad.t+2);
  ctx.fillStyle="#3a3f47"; ctx.fillText("● raw", W-pad.r-42, pad.t+2);
}

// ═══════════════════════════════════════════════════════
// TYPE GAME — MULTIPLAYER TYPING RACE
// Everyone types the SAME words. Each player self-reports
// live wpm/progress to Firebase; all see a live leaderboard.
// ═══════════════════════════════════════════════════════
const TP_ROOT="typerace1";
let TP_code="", TP_isHost=false;
let TP_state=null, TP_players={};
let TP_sref=null, TP_scb=null, TP_pref=null, TP_pcb=null;
let TP_sig=null, TP_localRaceId=null;
let TP_countTimer=null, TP_wpmRaf=null;
let TP_raceEnabled=false, TP_finished=false, TP_raceStartMs=0, TP_lastBcast=0;
let TP_wordCount=30;

const TP_sRef=()=>db.ref(`${TP_ROOT}/${TP_code}/state`);
const TP_playersRef=()=>db.ref(`${TP_ROOT}/${TP_code}/players`);
const TP_meRef=()=>db.ref(`${TP_ROOT}/${TP_code}/players/${myId}`);
const TP_focus=()=>{ const h=document.getElementById("type-hidden"); if(h) h.focus({preventScroll:true}); };

// ── Firebase wiring ───────────────────────────────────────────────
function TP_attach(){
  TP_detach();
  TP_sref=TP_sRef();
  TP_scb=snap=>{ if(snap.exists()){ TP_state=snap.val(); renderType(); } };
  TP_sref.on("value",TP_scb);
  TP_pref=TP_playersRef();
  TP_pcb=snap=>{ TP_players=snap.val()||{}; renderType(); };
  TP_pref.on("value",TP_pcb);
}
function TP_detach(){
  if(TP_sref&&TP_scb) TP_sref.off("value",TP_scb);
  if(TP_pref&&TP_pcb) TP_pref.off("value",TP_pcb);
  TP_sref=TP_scb=TP_pref=TP_pcb=null;
}

async function TP_create(){
  TP_code=rc(); TP_isHost=true; TP_finished=false; TP_localRaceId=null; TP_sig=null;
  TP_state={phase:"lobby",host:myId,words:[],wordCount:TP_wordCount,raceId:null,startAt:null};
  await TP_sRef().set(TP_state);
  await TP_meRef().set({name:myName,av:myAv,wpm:0,prog:0,acc:100,done:false,doneMs:0,joinedAt:ms()});
  TP_meRef().onDisconnect().remove();
  TP_attach();
  trackEvent("type_race_create",{});
  renderType();
}
async function TP_joinRoom(code){
  TP_code=code; TP_isHost=false; TP_finished=false; TP_localRaceId=null; TP_sig=null;
  const snap=await TP_sRef().once("value");
  if(!snap.exists()){ toast("Room not found!","err"); TP_code=""; renderType(); return; }
  TP_state=snap.val();
  if(TP_state.phase!=="lobby"){ toast("Race already started!","err"); TP_code=""; TP_state=null; renderType(); return; }
  TP_isHost=(TP_state.host===myId);
  await TP_meRef().set({name:myName,av:myAv,wpm:0,prog:0,acc:100,done:false,doneMs:0,joinedAt:ms()});
  TP_meRef().onDisconnect().remove();
  TP_attach();
  trackEvent("type_race_join",{});
  renderType();
}
async function TP_start(){
  if(!TP_isHost) return;
  const wc=TP_state.wordCount||TP_wordCount;
  const words=TYPE_buildWords(wc);
  const updates={};
  updates["state"]={...TP_state,phase:"race",raceId:uid(),startAt:ms()+4500,words};
  Object.keys(TP_players||{}).forEach(pid=>{
    updates[`players/${pid}/prog`]=0; updates[`players/${pid}/wpm`]=0;
    updates[`players/${pid}/acc`]=100; updates[`players/${pid}/done`]=false; updates[`players/${pid}/doneMs`]=0;
  });
  await db.ref(`${TP_ROOT}/${TP_code}`).update(updates);
  trackEvent("type_race_start",{players:Object.keys(TP_players||{}).length});
}
function TP_leave(toMenu){
  TP_detach();
  if(TP_countTimer){ clearInterval(TP_countTimer); TP_countTimer=null; }
  if(TP_wpmRaf){ cancelAnimationFrame(TP_wpmRaf); TP_wpmRaf=null; }
  document.removeEventListener("keydown", TP_onKey);
  TP_raceEnabled=false; TP_finished=false;
  if(TP_code){ try{ TP_meRef().onDisconnect().cancel(); TP_meRef().remove(); }catch(e){} }
  TP_code=""; TP_state=null; TP_players={}; TP_sig=null; TP_localRaceId=null;
  if(toMenu){ TYPE_view="menu"; renderType(); }
}

// ── Router / screens ──────────────────────────────────────────────
function TP_render(){
  const app=document.getElementById("app"); if(!app) return;
  document.body.classList.add("typing-mode");
  const phase = TP_state ? TP_state.phase : "setup";
  const sig = !TP_code ? "setup" : phase;
  if(sig===TP_sig){
    if(phase==="lobby"){ TP_patchLobby(); }
    else if(phase==="race"){
      if(TP_state.raceId!==TP_localRaceId) TP_startRaceLocal();
      TP_renderBoard();
    }
    return;
  }
  TP_sig=sig;
  if(!TP_code){ app.innerHTML=TP_setupScr(); TP_bindSetup(); }
  else if(phase==="lobby"){ app.innerHTML=TP_lobbyScr(); TP_bindLobby(); TP_patchLobby(); }
  else if(phase==="race"){ app.innerHTML=TP_raceScr(); TP_bindRace(); TP_startRaceLocal(); TP_renderBoard(); }
}

// (re)initialise the local typing engine for a race (also handles rematch)
function TP_startRaceLocal(){
  if(!TP_state) return;
  TP_localRaceId=TP_state.raceId;
  TP_finished=false; TP_raceEnabled=false;
  if(TP_wpmRaf){ cancelAnimationFrame(TP_wpmRaf); TP_wpmRaf=null; }
  TYPE_typed=""; TYPE_correctChars=0; TYPE_incorrectChars=0; TYPE_totalKeys=0; TYPE_scrollOffset=0;
  TYPE_queue=(TP_state.words||[]).slice();
  TYPE_target=TYPE_queue.join(" ");
  TYPE_renderWords();
  const inner=document.getElementById("type-inner"); if(inner) inner.style.transform="translateY(0px)";
  const fin=document.getElementById("tp-finish"); if(fin){ fin.classList.remove("show"); fin.innerHTML=""; }
  const stage=document.getElementById("type-stage"); if(stage) stage.style.display="";
  const lw=document.getElementById("tp-livewpm"); if(lw) lw.textContent="0";
  requestAnimationFrame(()=>TYPE_updateCursor());
  TP_raceStartMs=TP_state.startAt;
  TP_startCountdown();
}

function TP_startCountdown(){
  clearInterval(TP_countTimer);
  const el=document.getElementById("tp-count");
  const upd=()=>{
    if(!TP_state){ clearInterval(TP_countTimer); return; }
    const left=TP_state.startAt-Date.now();
    if(left>350){ if(el){ el.style.display="flex"; el.textContent=Math.ceil(left/1000); } }
    else if(left>-700){
      if(el){ el.style.display="flex"; el.textContent="GO!"; }
      if(!TP_raceEnabled && !TP_finished){ TP_raceEnabled=true; TP_focus(); TP_wpmStart(); }
    } else {
      if(el) el.style.display="none";
      clearInterval(TP_countTimer); TP_countTimer=null;
    }
  };
  upd(); TP_countTimer=setInterval(upd,90);
}

function TP_wpmStart(){
  if(TP_wpmRaf) cancelAnimationFrame(TP_wpmRaf);
  const loop=()=>{
    if(!TP_raceEnabled){ TP_wpmRaf=null; return; }
    const now=Date.now();
    const mins=Math.max(0.0001,(now-TP_raceStartMs)/60000);
    const wpm=Math.max(0,Math.round((TYPE_correctChars/5)/mins));
    const lw=document.getElementById("tp-livewpm"); if(lw) lw.textContent=wpm;
    const lt=document.getElementById("tp-livetimer"); if(lt) lt.textContent=Math.max(0,Math.floor((now-TP_raceStartMs)/1000))+"s";
    if(now-TP_lastBcast>450) TP_broadcast(true);
    TP_wpmRaf=requestAnimationFrame(loop);
  };
  TP_wpmRaf=requestAnimationFrame(loop);
}

function TP_onKey(e){
  if(!TP_raceEnabled || TP_finished){
    if(e.key && (e.key.length===1 || e.key==="Backspace")) e.preventDefault();
    return;
  }
  if(e.key==="Backspace"){ e.preventDefault(); if(TYPE_typed.length>0){ TYPE_typed=TYPE_typed.slice(0,-1); TYPE_refreshLetters(); TP_broadcast(); } return; }
  if(e.key.length!==1) return;
  e.preventDefault();
  TYPE_typed+=e.key; TYPE_totalKeys++;
  TYPE_refreshLetters();
  TP_broadcast();
  if(TYPE_typed.length>=TYPE_target.length) TP_finishLocal();
}

function TP_broadcast(force){
  if(!TP_code) return;
  const now=Date.now();
  if(!force && now-TP_lastBcast<130) return;
  TP_lastBcast=now;
  const mins=Math.max(0.0001,(now-TP_raceStartMs)/60000);
  const wpm=Math.max(0,Math.round((TYPE_correctChars/5)/mins));
  const prog=TYPE_target.length?Math.min(1,TYPE_typed.length/TYPE_target.length):0;
  const acc=Math.round((TYPE_correctChars/Math.max(1,TYPE_correctChars+TYPE_incorrectChars))*100);
  try{ TP_meRef().update({wpm,prog,acc}); }catch(e){}
}

function TP_finishLocal(){
  if(TP_finished) return; TP_finished=true; TP_raceEnabled=false;
  if(TP_wpmRaf){ cancelAnimationFrame(TP_wpmRaf); TP_wpmRaf=null; }
  const now=Date.now();
  const mins=Math.max(0.0001,(now-TP_raceStartMs)/60000);
  const wpm=Math.max(0,Math.round((TYPE_correctChars/5)/mins));
  const acc=Math.round((TYPE_correctChars/Math.max(1,TYPE_correctChars+TYPE_incorrectChars))*100);
  const secs=(now-TP_raceStartMs)/1000;
  try{ TP_meRef().update({wpm,prog:1,acc,done:true,doneMs:now-TP_raceStartMs}); }catch(e){}
  try{ playSfx('win'); }catch(e){}
  trackEvent("type_race_finish",{wpm,acc});
  const stage=document.getElementById("type-stage"); if(stage) stage.style.display="none";
  const fin=document.getElementById("tp-finish");
  if(fin){
    fin.innerHTML=`<div class="fbig">${wpm}<small> wpm</small></div><div style="color:var(--te);font-family:'JetBrains Mono',monospace;margin-top:10px;font-size:14px">${acc}% accuracy · ${secs.toFixed(1)}s</div><div style="color:var(--mu);font-size:12px;margin-top:8px">✓ finished — watch the others race above ↑</div>`;
    fin.classList.add("show");
  }
  TP_renderBoard();
}

function TP_boardRows(){
  const arr=Object.entries(TP_players||{}).map(([pid,p])=>({pid,...p}));
  arr.sort((a,b)=>{
    if(a.done&&b.done) return (a.doneMs||0)-(b.doneMs||0);
    if(a.done) return -1; if(b.done) return 1;
    return (b.prog||0)-(a.prog||0);
  });
  return arr;
}
function TP_renderBoard(){
  const board=document.getElementById("tp-board"); if(!board) return;
  const arr=TP_boardRows();
  board.innerHTML=arr.map((p,i)=>{
    const rank=p.done?(i===0?"🥇":i===1?"🥈":i===2?"🥉":`${i+1}`):`${i+1}`;
    const pct=Math.round((p.prog||0)*100);
    return`<div class="tp-row ${p.pid===myId?"me":""} ${p.done?"done":""}">
      <div class="tp-fill" style="width:${pct}%"></div>
      <div class="tp-rowinner">
        <span class="tp-rank">${rank}</span>
        <span class="tp-av">${p.av||"🙂"}</span>
        <span class="tp-name">${p.name||"?"}${p.pid===myId?' <span class="youtag">(you)</span>':''}</span>
        <span class="tp-wpm">${p.wpm||0}<small>wpm</small></span>
        ${p.done?'<span class="tp-check">✓</span>':''}
      </div></div>`;
  }).join("");
  const eb=document.getElementById("tp-endbar");
  if(eb){
    if(arr.length>0 && arr.every(p=>p.done)){
      eb.innerHTML = TP_isHost
        ? `<div style="text-align:center;color:#00E096;font-family:'JetBrains Mono',monospace;font-weight:700;margin:12px 0">🏁 Everyone finished!</div><button class="btn" id="tp-again" style="background:#00E096;color:#000;font-size:16px;padding:14px">🔁 Race Again</button>`
        : `<div style="text-align:center;color:var(--mu);font-size:14px;padding:14px"><span class="blink">🏁</span> Everyone finished — waiting for host to restart…</div>`;
      const again=document.getElementById("tp-again"); if(again) again.onclick=()=>TP_start();
    } else eb.innerHTML="";
  }
}

  <div style="text-align:center;margin-top:28px;color:var(--mu);font-size:12px">zipzap-games.com · More games coming soon</div>
</div>`;}

// ═══════════════════════════════════════════════════════
// SHARED SYNC & RENDER ROUTER
// ═══════════════════════════════════════════════════════
function syncLocal(){
  if(!gs||!currentGame)return;
  if(currentGame==="blitz"){
    if(gs.round!==B_lastRound){B_hasSubmitted=false;B_hasVoted=false;B_lastRound=gs.round;B_lastCIdx=-1;}
    if(gs.phase==="active"&&gs.subs?.find(s=>s.pid===myId))B_hasSubmitted=true;
    if(gs.phase==="challenge"&&gs.cVotes?.[myId])B_hasVoted=true;
  }
  if(currentGame==="psych"){
    if(gs.round!==P_lastRound){P_hasSubmitted=false;P_hasVoted=false;P_lastRound=gs.round;}
    if(gs.phase==="submit"&&gs.answers?.find(a=>a.pid===myId))P_hasSubmitted=true;
    if(gs.phase==="vote"&&gs.votes?.[myId])P_hasVoted=true;
  }
  if(currentGame==="draw"){
    if(gs.round!==D_lastRound){D_hasGuessed=false;D_lastRound=gs.round;}
  }
}

function render(){
  if(!currentGame){
    const app=document.getElementById("app");if(!app)return;
    app.innerHTML=scrHome();return;
  }
  if(currentGame==="blitz"){renderBlitz();return;}
  if(currentGame==="psych"){renderPsych();return;}
  if(currentGame==="draw") {renderDraw(); return;}
  if(currentGame==="type") {renderType(); return;}
}

render();
</script>
