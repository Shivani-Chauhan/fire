<style>
  :root{--ink:#eaf0ff;--mut:#8a94c0;--accent:#ffcf5c}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{min-height:100vh;background:#0b1026;color:var(--ink);
    font-family:ui-sans-serif,system-ui,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    display:flex;flex-direction:column;align-items:center;padding:12px;gap:12px}
  .shell{width:100%;max-width:440px;display:flex;flex-direction:column;gap:12px}
  header{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .brand{display:flex;flex-direction:column;gap:1px}
  .eyebrow{font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--mut);font-weight:700;text-decoration:none}
  h1{font-size:clamp(20px,5vw,26px);font-weight:800;letter-spacing:-.01em;text-transform:uppercase;line-height:1}
  h1 em{font-style:normal;color:var(--accent)}
  .scores{display:flex;gap:18px;align-items:flex-end}
  .stat{display:flex;flex-direction:column;align-items:flex-end;gap:1px}
  .stat b{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:clamp(20px,5vw,28px);font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
  .stat span{font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--mut)}
  .stage{position:relative;border-radius:16px;overflow:hidden;box-shadow:0 24px 60px -22px rgba(0,0,0,.8),inset 0 0 0 1px rgba(255,255,255,.06)}

  .over{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:6px;
    background:rgba(8,12,32,.72);backdrop-filter:blur(3px);text-align:center;padding:20px}
  .over.show{display:flex;animation:fade .3s ease}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .over h2{font-size:30px;font-weight:800}
  .over .big{font-family:ui-monospace,monospace;font-size:60px;font-weight:700;line-height:1;color:var(--accent)}

    border:1px solid rgba(255,255,255,.25);border-radius:9px;padding:10px 18px;font-weight:700}
  .drop{width:100%;border:none;border-radius:14px;padding:16px;font-family:inherit;font-weight:800;font-size:18px;

    background:linear-gradient(180deg,#ffe08a,#ffcf5c);box-shadow:0 8px 0 -1px #c99a2a;transition:transform .08s,box-shadow .08s}

  @media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important}}

<body>
<div class="shell">
  <header>
    <div class="brand">
      <a class="eyebrow" href="/">&larr; ZipZap Games</a>
      <h1>Sky<em>scrapers</em></h1>
    </div>
    <div class="scores">
      <div class="stat"><b id="score">0</b><span>Floors</span></div>
      <div class="stat"><b id="best">0</b><span>Best</span></div>
    </div>
  </header>
  <div class="stage">
    <canvas id="game" width="420" height="680"></canvas>
    <div class="over" id="over">
      <h2>Timber! 🏗️</h2>
      <div class="big" id="finalScore">0</div>
      <div class="sub" id="finalSub">floors built</div>
      <div class="again">Tap to build again</div>
    </div>
  </div>
  <button class="drop" id="dropBtn">Drop block 🏗️</button>
  <div class="tip">Tap the tower, hit the button, or press <b>Space</b> to drop</div>
</div>

<script>
(function(){
  "use strict";
  const cv=document.getElementById('game'), ctx=cv.getContext('2d');
  const W=420, H=680;
  function sharpen(){ const dpr=Math.min(window.devicePixelRatio||1,3); cv.width=W*dpr; cv.height=H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0); }
  sharpen(); window.addEventListener('resize',sharpen);

  // ── constants ──────────────────────────────────────────
  const BLOCK_H=38, INIT_W=156, PERFECT_TOL=4.4, PERFECT_GROW=5;
  const CRANE_GAP=180;        // world-height the crane holds the block above the tower
  const DROP_Y=H*0.70;        // screen-Y where the tower's top surface sits
  const BEAM_Y=44;            // screen-Y of the crane jib
  const clamp=(v,a,b)=>v<a?a:v>b?b:v;
  const lerp=(a,b,t)=>a+(b-a)*t;
  const lerpA=(a,b,u)=>a.map((v,i)=>v+(b[i]-v)*u);

  // cheerful cartoon building colours [light, base, dark]
  const PALETTE=[
    ['#ffd3d3','#ff8787','#e64b4b'], ['#ffe3c2','#ffb35c','#e8862f'],
    ['#fff3b8','#ffe066','#e0b100'], ['#d3f9d8','#8ce99a','#40c057'],
    ['#c5f6fa','#66d9e8','#1098ad'], ['#d0ebff','#74c0fc','#1c7ed6'],
    ['#e5dbff','#b197fc','#7048e8'], ['#ffdeeb','#faa2c1','#e64980'],
  ];
  const col=i=>PALETTE[((i%PALETTE.length)+PALETTE.length)%PALETTE.length];
  const litWin=(seed,k)=>{ const x=Math.sin(seed*12.9898+k*78.233)*43758.5453; return (x-Math.floor(x))>0.42; };

  // day → sunset → dusk → night sky keyframes
  const SKY=[
    {t:0.0, top:[120,196,255], bot:[206,238,255]},
    {t:0.42,top:[255,160,118], bot:[255,225,170]},
    {t:0.72,top:[92,86,158],   bot:[214,142,168]},
    {t:1.0, top:[12,16,44],    bot:[40,36,92]},
  ];
  function skyAt(t){ t=clamp(t,0,1); for(let i=0;i<SKY.length-1;i++){ if(t<=SKY[i+1].t){ const u=(t-SKY[i].t)/(SKY[i+1].t-SKY[i].t); return {top:lerpA(SKY[i].top,SKY[i+1].top,u),bot:lerpA(SKY[i].bot,SKY[i+1].bot,u)}; } } return {top:SKY[3].top,bot:SKY[3].bot}; }

  // ── state ──────────────────────────────────────────────
  let blocks, cur, phase, fall, fallV, scroll, debris, pops, score, combo, speed, shake, best, flashPerfect;
  best = +(localStorage.getItem('zz_sky_best')||0);
  document.getElementById('best').textContent=best;

  const stars=[]; for(let i=0;i<70;i++) stars.push({x:Math.random()*W,y:Math.random()*H*0.7,r:Math.random()*1.4+.3,tw:Math.random()*6.28});
  const clouds=[]; for(let i=0;i<5;i++) clouds.push({x:Math.random()*W, y:56+Math.random()*250, s:.55+Math.random()*.7, spd:5+Math.random()*9});
  const skyline=[]; for(let i=0,x=-10;x<W+10;i++){ const w=20+Math.random()*32, h=34+Math.random()*90; skyline.push({x,w,h}); x+=w+3; }

  function reset(){
    blocks=[{x:(W-INIT_W)/2, w:INIT_W, seed:7}];
    score=0; combo=0; speed=2.0; phase='move'; scroll=BLOCK_H; debris=[]; pops=[]; shake=0; flashPerfect=0;
    document.getElementById('score').textContent=0;
    document.getElementById('over').classList.remove('show');
    spawn();
  }
  function spawn(){
    const w=blocks[blocks.length-1].w;
    const left=Math.random()<.5;
    cur={x:left?0:W-w, w, dir:left?1:-1, seed:1+Math.floor(Math.random()*9999)};
    fall=CRANE_GAP; fallV=0; phase='move';
  }
  function drop(){
    if(phase==='move'){ phase='drop'; fallV=300; }
    else if(phase==='over'){ reset(); }
  }

  function fallDebris(x,w,color){
    return {x, w, y:DROP_Y-BLOCK_H, vy:-1-Math.random()*2, vx:(Math.random()-.5)*2 + (x<W/2?-1.4:1.4), rot:0, rv:(Math.random()-.5)*.25, color, life:1};
  }

  function resolve(){
    const prev=blocks[blocks.length-1];
    const L=Math.max(cur.x, prev.x), R=Math.min(cur.x+cur.w, prev.x+prev.w);
    const ov=R-L;
    const color=col(blocks.length)[1];
    if(ov<=0){                              // total miss → game over
      debris.push(fallDebris(cur.x,cur.w,color));
      phase='over'; shake=8; sfx('over');
      if(score>best){ best=score; localStorage.setItem('zz_sky_best',best); document.getElementById('best').textContent=best; }
      const ov2=document.getElementById('over');
      document.getElementById('finalScore').textContent=score;
      document.getElementById('finalSub').textContent = score+(score===1?' floor built':' floors built')+(score>=best&&score>0?' · new best! 🏆':'');
      ov2.classList.add('show');
      return;
    }
    const dx=cur.x-prev.x;
    let nx,nw;
    if(Math.abs(dx)<=PERFECT_TOL){          // perfect drop
      nw=Math.min(INIT_W, prev.w+PERFECT_GROW);
      nx=clamp(prev.x-(nw-prev.w)/2,0,W-nw);
      combo++; flashPerfect=1; shake=2; sfx('perfect');
      pops.push({x:nx+nw/2, y:DROP_Y-BLOCK_H, life:1, combo});
    } else {                                // trim the overhang
      combo=0; nx=L; nw=ov; shake=1; sfx('drop');
      if(cur.x<prev.x) debris.push(fallDebris(cur.x, prev.x-cur.x, color));
      else debris.push(fallDebris(R, (cur.x+cur.w)-R, color));
    }
    blocks.push({x:nx, w:nw, seed:cur.seed});
    score++; document.getElementById('score').textContent=score;
    speed=Math.min(7.2, 2.0+score*0.058);
    spawn();
  }

  // ── update ─────────────────────────────────────────────
  function update(dt){
    const targetScroll = blocks.length*BLOCK_H;
    scroll += (targetScroll-scroll)*Math.min(1,dt*7);
    if(shake>0) shake=Math.max(0,shake-dt*22);
    if(flashPerfect>0) flashPerfect=Math.max(0,flashPerfect-dt*2.2);

    if(phase==='move'){
      cur.x += cur.dir*speed*(dt*60);
      if(cur.x<=0){ cur.x=0; cur.dir=1; } else if(cur.x>=W-cur.w){ cur.x=W-cur.w; cur.dir=-1; }
    } else if(phase==='drop'){
      fallV += 2600*dt; fall -= fallV*dt;
      if(fall<=0){ fall=0; resolve(); }
    }
    debris.forEach(d=>{ d.vy += 26*dt; d.y += d.vy; d.x += d.vx; d.rot += d.rv; d.life -= dt*0.5; });
    debris=debris.filter(d=>d.y<H+80 && d.life>0);
    pops.forEach(p=>p.life-=dt*1.4); pops=pops.filter(p=>p.life>0);
    clouds.forEach(c=>{ c.x += c.spd*dt; if(c.x-40*c.s>W) c.x=-40*c.s; });
  }

  // ── render ─────────────────────────────────────────────
  function sY(worldY){ return DROP_Y-(worldY-scroll); }
  function rr(x,y,w,h,r){ r=Math.min(r,w/2,h/2); ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
  function puff(x,y,s){ ctx.beginPath(); ctx.arc(x,y,16*s,0,6.29); ctx.arc(x+17*s,y+4*s,12*s,0,6.29); ctx.arc(x-16*s,y+5*s,11*s,0,6.29); ctx.arc(x+2*s,y-8*s,12*s,0,6.29); ctx.arc(x-8*s,y-2*s,10*s,0,6.29); ctx.closePath(); ctx.fill(); }

  // a colourful cartoon building floor
  function drawBlock(x,top,w,i,seed,glow,isBase){
    const [light,base,dark]=col(i);
    const g=ctx.createLinearGradient(x,0,x+w,0);
    g.addColorStop(0,light); g.addColorStop(.16,base); g.addColorStop(1,dark);
    ctx.fillStyle=g; rr(x,top,w,BLOCK_H,6); ctx.fill();
    ctx.lineJoin='round'; ctx.strokeStyle='rgba(44,32,64,.55)'; ctx.lineWidth=2.4; rr(x,top,w,BLOCK_H,6); ctx.stroke();  // cartoon outline
    ctx.fillStyle=light; ctx.globalAlpha=.75; rr(x+3,top+3,Math.max(0,w-6),4,3); ctx.fill(); ctx.globalAlpha=1;         // top rim highlight
    if(isBase && w>44){                                                                                                 // ground floor: awning + door
      ctx.fillStyle=dark; for(let a=x+5;a<x+w-6;a+=13){ ctx.beginPath(); ctx.moveTo(a,top+9); ctx.lineTo(a+6.5,top+9); ctx.lineTo(a+3.25,top+15); ctx.closePath(); ctx.fill(); }
      const dw=Math.min(20,w*.22), dxp=x+(w-dw)/2, dy=top+BLOCK_H-15;
      ctx.fillStyle='rgba(40,28,60,.7)'; rr(dxp,dy,dw,15,4); ctx.fill();
      ctx.fillStyle='rgba(255,246,201,.7)'; ctx.fillRect(dxp+dw/2-0.6,dy+3,1.2,9);
    } else {                                                                                                            // windows
      const ww=9, wh=13, gap=7, pad=8, usable=w-pad*2;
      const cols=Math.max(0,Math.floor((usable+gap)/(ww+gap)));
      const rowY=top+(BLOCK_H-wh)/2+1, sx=x+(w-(cols*ww+(cols-1)*gap))/2;
      for(let k=0;k<cols;k++){ const wx=sx+k*(ww+gap), on=litWin(seed,k);
        ctx.fillStyle= on?'#fff6c9':'rgba(38,30,58,.5)'; rr(wx,rowY,ww,wh,2.5); ctx.fill();
        if(on){ ctx.fillStyle='rgba(255,255,255,.55)'; ctx.fillRect(wx+1.6,rowY+1.6,3,3); }
        ctx.strokeStyle='rgba(44,32,64,.3)'; ctx.lineWidth=1; rr(wx,rowY,ww,wh,2.5); ctx.stroke(); }
    }
    if(glow){ ctx.strokeStyle='rgba(255,255,255,.95)'; ctx.lineWidth=2.5; rr(x,top,w,BLOCK_H,6); ctx.stroke(); }
  }
  function drawRoof(x,ty,w,i){
    const dark=col(i)[2];
    ctx.fillStyle=dark; rr(x+1,ty-3,w-2,4,2); ctx.fill();                    // ledge
    const tw=clamp(w*.2,8,15), tx=x+w*.18;
    ctx.fillStyle='#9aa3c8'; rr(tx,ty-13,tw,11,2); ctx.fill();               // water tank
    ctx.strokeStyle='rgba(44,32,64,.4)'; ctx.lineWidth=1.3; rr(tx,ty-13,tw,11,2); ctx.stroke();
    const ax=x+w*.72;
    ctx.strokeStyle='#4a4470'; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(ax,ty-2); ctx.lineTo(ax,ty-17); ctx.stroke();
    ctx.fillStyle=(Math.sin(performance.now()/300)>0)?'#ff5b5b':'#7a2b2b'; ctx.beginPath(); ctx.arc(ax,ty-18,2.3,0,6.29); ctx.fill();
  }

  function render(){
    const t=clamp(score/58,0,1);
    // sky gradient
    const sk=skyAt(t), g=ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,`rgb(${sk.top[0]|0},${sk.top[1]|0},${sk.top[2]|0})`);
    g.addColorStop(1,`rgb(${sk.bot[0]|0},${sk.bot[1]|0},${sk.bot[2]|0})`);
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);

    // sun / moon
    const night=clamp((t-0.55)/0.45,0,1), cx=W*0.75, cy=lerp(H*0.15,H*0.32,t);
    const gc=night<.5?'255,224,130':'226,234,255';
    const glow=ctx.createRadialGradient(cx,cy,4,cx,cy,74); glow.addColorStop(0,`rgba(${gc},.55)`); glow.addColorStop(1,`rgba(${gc},0)`);
    ctx.fillStyle=glow; ctx.fillRect(cx-84,cy-84,168,168);
    ctx.fillStyle=night<.5?'#ffe08a':'#eef2ff'; ctx.beginPath(); ctx.arc(cx,cy,22,0,6.29); ctx.fill();
    if(night>.5){ ctx.fillStyle='rgba(180,190,220,.55)'; ctx.beginPath(); ctx.arc(cx-6,cy-4,4,0,6.29); ctx.arc(cx+7,cy+5,3,0,6.29); ctx.arc(cx+2,cy-8,2.4,0,6.29); ctx.fill(); }

    // stars (night)
    if(t>0.4){ ctx.fillStyle='#fff'; stars.forEach(s=>{ ctx.globalAlpha=clamp((t-0.4)/0.4,0,1)*(0.5+0.5*Math.sin(s.tw+performance.now()/700)); ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,6.29); ctx.fill(); }); ctx.globalAlpha=1; }
    // clouds (fade out at night)
    const ca=clamp(1-t*1.5,0,1); if(ca>0){ ctx.fillStyle='#ffffff'; clouds.forEach(c=>{ ctx.globalAlpha=ca*.92; puff(c.x,c.y,c.s); }); ctx.globalAlpha=1; }

    const sh = shake>0 ? (Math.random()-.5)*shake : 0;
    ctx.save(); ctx.translate(sh, sh*0.5);

    // colourful skyline near the base
    const baseScreen=sY(0);
    if(baseScreen>-260 && baseScreen<H+260){
      const sc=lerpA([104,132,186],[26,30,66],t);
      ctx.fillStyle=`rgb(${sc[0]|0},${sc[1]|0},${sc[2]|0})`;
      skyline.forEach(b=>ctx.fillRect(b.x, baseScreen-b.h, b.w, b.h+300));
      if(t>0.35){ ctx.fillStyle=`rgba(255,214,120,${clamp((t-0.35)/0.5,0,1)*0.85})`;
        skyline.forEach(b=>{ for(let wy=baseScreen-b.h+7; wy<baseScreen-8; wy+=13){ for(let wx=b.x+5; wx<b.x+b.w-6; wx+=10){ if(((wx*7+wy)|0)%3===0) ctx.fillRect(wx,wy,4,6); } } }); }
    }

    // tower blocks (top-down until off screen)
    for(let i=blocks.length-1;i>=0;i--){
      const top=sY((i+1)*BLOCK_H);
      if(top>H) continue; if(top+BLOCK_H<0) break;
      drawBlock(blocks[i].x, top, blocks[i].w, i, blocks[i].seed, false, i===0);
    }
    // rooftop detail on the current tip (only while the crane is holding the next block up high)
    if(phase==='move' && blocks.length){ const ti=blocks.length-1, ty=sY(blocks.length*BLOCK_H); if(ty>-20&&ty<H) drawRoof(blocks[ti].x, ty, blocks[ti].w, ti); }

    // falling debris
    debris.forEach(d=>{ ctx.save(); ctx.globalAlpha=Math.max(0,d.life); ctx.translate(d.x+d.w/2,d.y+BLOCK_H/2); ctx.rotate(d.rot);
      ctx.fillStyle=d.color; rr(-d.w/2,-BLOCK_H/2,d.w,BLOCK_H,5); ctx.fill();
      ctx.strokeStyle='rgba(44,32,64,.4)'; ctx.lineWidth=2; rr(-d.w/2,-BLOCK_H/2,d.w,BLOCK_H,5); ctx.stroke(); ctx.restore(); });

    // moving / dropping block + crane
    if(phase==='move'||phase==='drop'){
      const bottom=sY(blocks.length*BLOCK_H + fall);
      const top=bottom-BLOCK_H;
      const cx2=cur.x+cur.w/2;
      ctx.strokeStyle='#3a4472'; ctx.lineWidth=6; ctx.lineCap='round';
      ctx.beginPath(); ctx.moveTo(W-9,BEAM_Y); ctx.lineTo(W-9,H); ctx.stroke();           // mast
      ctx.lineWidth=7; ctx.beginPath(); ctx.moveTo(2,BEAM_Y); ctx.lineTo(W-6,BEAM_Y); ctx.stroke(); // jib
      ctx.fillStyle='#ffcf5c'; rr(cx2-11,BEAM_Y-6,22,12,3); ctx.fill();                    // trolley
      ctx.fillStyle='#2b3358'; ctx.fillRect(W-16,BEAM_Y-9,10,10);                          // motor
      if(phase==='move'){ ctx.strokeStyle='#c7cef0'; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(cx2,BEAM_Y+6); ctx.lineTo(cx2,top); ctx.stroke();
        ctx.fillStyle='#c7cef0'; ctx.fillRect(cx2-4,top-3,8,4); }                          // cable + hook
      drawBlock(cur.x, top, cur.w, blocks.length, cur.seed, phase==='move', false);
    }

    // perfect pops
    pops.forEach(p=>{ ctx.save(); ctx.globalAlpha=clamp(p.life,0,1);
      ctx.fillStyle='#fff'; ctx.font='800 15px ui-sans-serif,system-ui'; ctx.textAlign='center';
      ctx.fillText(p.combo>1?`PERFECT ×${p.combo}`:'PERFECT!', p.x, p.y-14-(1-p.life)*20);
      ctx.strokeStyle=`rgba(255,255,255,${p.life*.6})`; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(p.x,p.y,(1-p.life)*40,0,6.29); ctx.stroke(); ctx.restore(); });

    if(flashPerfect>0){ ctx.fillStyle=`rgba(255,255,255,${flashPerfect*0.12})`; ctx.fillRect(0,0,W,H); }
    ctx.restore();
  }

  // ── loop ───────────────────────────────────────────────
  let last=performance.now();
  function loop(now){ const dt=Math.min((now-last)/1000,1/30); last=now; update(dt); render(); requestAnimationFrame(loop); }

  // ── audio (subtle) ─────────────────────────────────────
  let AC; function sfx(kind){ try{ AC=AC||new (window.AudioContext||window.webkitAudioContext)(); const o=AC.createOscillator(),g=AC.createGain(); o.connect(g); g.connect(AC.destination);
    const f=kind==='perfect'?880:kind==='over'?150:330; o.frequency.value=f; if(kind==='perfect'){o.frequency.exponentialRampToValueAtTime(1320,AC.currentTime+.09);} if(kind==='over'){o.frequency.exponentialRampToValueAtTime(70,AC.currentTime+.3);}
    g.gain.value=.05; g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+(kind==='over'?.32:.13)); o.start(); o.stop(AC.currentTime+(kind==='over'?.33:.14)); }catch(e){} }

  // ── input ──────────────────────────────────────────────
  cv.addEventListener('pointerdown', e=>{ e.preventDefault(); drop(); });
  document.getElementById('dropBtn').addEventListener('click', drop);
  document.getElementById('over').addEventListener('pointerdown', e=>{ e.preventDefault(); drop(); });
  window.addEventListener('keydown', e=>{ if(e.key===' '||e.key==='Enter'||e.key==='ArrowDown'){ e.preventDefault(); drop(); } }, {passive:false});

  reset();
  requestAnimationFrame(loop);
})();
</script>
</body>
