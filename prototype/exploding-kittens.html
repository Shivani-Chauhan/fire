<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Exploding Kittens — Cute Prototype | ZipZap Games</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg1:#ffe3f1; --bg2:#e7e0ff; --bg3:#d8f3ff;
    --ink:#4a3b57; --mut:#9a8caa; --card:#fffdf8; --line:#f0e6f5;
    --pink:#ff8fb3; --mint:#57d6b6; --sky:#7ec8ff; --grape:#a988ff; --peach:#ffb27a; --sun:#ffd23f;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{
    min-height:100vh;color:var(--ink);
    font-family:'Baloo 2','Nunito',ui-rounded,system-ui,sans-serif;
    background:linear-gradient(160deg,var(--bg1),var(--bg2) 55%,var(--bg3));
    background-attachment:fixed;
    display:flex;justify-content:center;padding:12px;
  }
  #app{width:100%;max-width:860px;display:flex;flex-direction:column;gap:12px}

  header{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
  .logo{display:flex;align-items:center;gap:10px}
  .logo .tt{font-weight:800;font-size:clamp(20px,4.4vw,28px);letter-spacing:.5px;line-height:1}
  .logo .tt em{font-style:normal;color:var(--pink)}
  .logo .sub{font-size:11px;color:var(--mut);font-weight:700;letter-spacing:.05em}
  .home{font-size:11px;color:var(--mut);text-decoration:none;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
  .btn{border:none;border-radius:14px;padding:10px 18px;font-family:inherit;font-weight:800;font-size:14px;
    cursor:pointer;color:#fff;background:var(--pink);box-shadow:0 6px 0 -1px rgba(255,143,179,.4);transition:transform .1s,box-shadow .1s}
  .btn:active{transform:translateY(3px);box-shadow:0 3px 0 -1px rgba(255,143,179,.4)}
  .btn.ghost{background:#fff;color:var(--ink);box-shadow:0 6px 0 -1px rgba(0,0,0,.06)}
  .btn.mint{background:var(--mint);box-shadow:0 6px 0 -1px rgba(87,214,182,.4)}
  .btn:disabled{opacity:.45;cursor:default;box-shadow:none;transform:none}

  /* opponents */
  .opps{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
  .opp{background:var(--card);border-radius:18px;padding:10px 12px;min-width:120px;text-align:center;
    box-shadow:0 8px 22px -12px rgba(120,80,160,.5);position:relative;transition:transform .15s,box-shadow .15s}
  .opp.active{box-shadow:0 0 0 3px var(--sun),0 8px 22px -10px rgba(120,80,160,.6);transform:translateY(-3px)}
  .opp.dead{opacity:.5;filter:grayscale(.6)}
  .opp .who{display:flex;align-items:center;justify-content:center;gap:6px;font-weight:800;font-size:14px}
  .opp .backs{display:flex;justify-content:center;margin-top:6px;height:34px}
  .opp .backs .mini{width:22px;height:31px;border-radius:5px;margin-left:-13px;
    background:linear-gradient(160deg,#ffb3d1,#c9a7ff);border:1.5px solid #fff;box-shadow:0 2px 4px rgba(0,0,0,.12)}
  .opp .backs .mini:first-child{margin-left:0}
  .opp .cnt{font-size:11px;color:var(--mut);font-weight:800;margin-top:3px}
  .opp .badge{position:absolute;top:-8px;right:-6px;font-size:18px;filter:drop-shadow(0 1px 1px rgba(0,0,0,.2))}

  /* table */
  .table{display:flex;align-items:center;justify-content:center;gap:22px;padding:6px 0}
  .pile{display:flex;flex-direction:column;align-items:center;gap:6px}
  .pile .lbl{font-size:10px;color:var(--mut);font-weight:800;letter-spacing:.14em;text-transform:uppercase}
  .deck{width:96px;height:136px;border-radius:16px;cursor:pointer;position:relative;
    background:linear-gradient(160deg,#ffb3d1,#c9a7ff);border:3px solid #fff;
    box-shadow:0 12px 26px -10px rgba(120,80,160,.7);display:flex;align-items:center;justify-content:center;
    transition:transform .12s}
  .deck:hover{transform:translateY(-3px) rotate(-1deg)}
  .deck.pulse{animation:pulse 1.1s ease-in-out infinite}
  @keyframes pulse{0%,100%{box-shadow:0 12px 26px -10px rgba(120,80,160,.7),0 0 0 0 rgba(255,210,63,.6)}50%{box-shadow:0 12px 26px -10px rgba(120,80,160,.7),0 0 0 8px rgba(255,210,63,0)}}
  .deck .paw{font-size:40px;filter:drop-shadow(0 2px 0 rgba(0,0,0,.08))}
  .deck .num{position:absolute;bottom:6px;right:9px;background:#fff;border-radius:10px;padding:1px 7px;font-size:12px;font-weight:800;color:var(--ink)}
  .discard{width:96px;height:136px;border-radius:16px;display:flex;align-items:center;justify-content:center}
  .discard.empty{border:3px dashed rgba(154,140,170,.5);color:var(--mut);font-size:11px;font-weight:800;text-align:center;padding:8px}

  .turnline{text-align:center;font-weight:800;font-size:15px;min-height:22px}
  .turnline b{color:var(--pink)}

  /* log */
  .log{background:rgba(255,255,255,.6);border-radius:14px;padding:8px 12px;max-height:92px;overflow-y:auto;
    font-family:'Nunito',sans-serif;font-size:12.5px;font-weight:700;color:var(--ink);line-height:1.55}
  .log div{opacity:.55}
  .log div:last-child{opacity:1}

  /* my hand */
  .handwrap{margin-top:2px}
  .handlbl{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
  .handlbl .t{font-size:11px;color:var(--mut);font-weight:800;letter-spacing:.14em;text-transform:uppercase}
  .hand{display:flex;gap:10px;overflow-x:auto;padding:6px 2px 14px;scroll-snap-type:x proximity}

  /* CARD */
  .card{flex:0 0 auto;width:104px;height:150px;border-radius:16px;background:var(--card);position:relative;
    padding:7px 7px 8px;box-shadow:0 10px 22px -12px rgba(120,80,160,.65);cursor:pointer;scroll-snap-align:center;
    border:2.5px solid var(--c,#ffd0e0);transition:transform .13s ease, box-shadow .13s ease}
  .card.play:hover{transform:translateY(-10px) rotate(-1.5deg);box-shadow:0 18px 26px -12px rgba(120,80,160,.7)}
  .card.sel{transform:translateY(-12px);box-shadow:0 0 0 3px var(--sun),0 16px 26px -12px rgba(120,80,160,.7)}
  .card .art{height:78px;border-radius:11px;background:var(--soft,#fff2f7);display:flex;align-items:center;justify-content:center;overflow:hidden}
  .card .art svg{width:88px;height:88px}
  .card .nm{font-size:12.5px;font-weight:800;line-height:1.05;margin-top:5px;text-align:center;color:var(--ink)}
  .card .ds{font-size:9px;font-weight:700;color:var(--mut);text-align:center;line-height:1.2;margin-top:2px;font-family:'Nunito',sans-serif}
  .card .cnr{position:absolute;top:5px;left:7px;font-size:15px;line-height:1}
  .card .cnr2{position:absolute;bottom:6px;right:8px;font-size:13px;line-height:1;transform:rotate(180deg);opacity:.5}
  .card.big{width:120px;height:174px}
  .card.big .art{height:96px}
  .card.big .art svg{width:106px;height:106px}
  .card.big .nm{font-size:14px}

  .controls{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}
  .hint{font-size:12px;color:var(--mut);font-weight:800;text-align:center;font-family:'Nunito',sans-serif}

  /* overlay / modal */
  #overlay{position:fixed;inset:0;background:rgba(74,59,87,.42);backdrop-filter:blur(3px);
    display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
  #overlay.on{display:flex}
  .modal{background:var(--card);border-radius:22px;padding:20px;max-width:400px;width:100%;text-align:center;
    box-shadow:0 24px 60px -20px rgba(80,40,110,.7);animation:pop .3s cubic-bezier(.34,1.56,.64,1)}
  @keyframes pop{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
  .modal h2{font-size:20px;font-weight:800;margin-bottom:4px}
  .modal p{font-family:'Nunito',sans-serif;font-weight:700;color:var(--mut);font-size:13px;margin-bottom:14px}
  .modal-btns{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
  .modal-row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:12px}
  .tinytimer{height:5px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:12px}
  .tinytimer i{display:block;height:100%;background:var(--pink);width:100%;transition:width linear}
  @media(max-width:520px){
    .card{width:92px;height:134px}
    .card .art{height:66px}.card .art svg{width:74px;height:74px}
    .deck,.discard{width:82px;height:116px}
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="overlay"></div>

<script>
"use strict";
(function(){
  const $ = s => document.querySelector(s);
  const app = $('#app'), overlay = $('#overlay');
  const sleep = ms => new Promise(r=>setTimeout(r,ms));
  const rnd = n => Math.floor(Math.random()*n);
  const shuffle = a => { for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]];} return a; };

  // ─────────────────────────────────────────────────────────────
  //  CUTE KITTEN ART  (parametric SVG — big eyes, blush, ears)
  // ─────────────────────────────────────────────────────────────
  function eye(cx, cy, style){
    const dark = '#4a3b57';
    switch(style){
      case 'happy': return `<path d="M${cx-7} ${cy+2} Q ${cx} ${cy-8} ${cx+7} ${cy+2}" fill="none" stroke="${dark}" stroke-width="3.2" stroke-linecap="round"/>`;
      case 'wide':  return `<ellipse cx="${cx}" cy="${cy}" rx="8.5" ry="10.5" fill="#fff" stroke="${dark}" stroke-width="2"/><circle cx="${cx}" cy="${cy+1}" r="4.6" fill="${dark}"/><circle cx="${cx-1.6}" cy="${cy-1.6}" r="1.7" fill="#fff"/>`;
      case 'sleepy':return `<path d="M${cx-7} ${cy-1} Q ${cx} ${cy+4} ${cx+7} ${cy-1}" fill="none" stroke="${dark}" stroke-width="3" stroke-linecap="round"/>`;
      case 'star':  return `<text x="${cx}" y="${cy+6}" font-size="18" text-anchor="middle" fill="#ffb800">✦</text>`;
      case 'x':     return `<path d="M${cx-6} ${cy-6} L${cx+6} ${cy+6} M${cx+6} ${cy-6} L${cx-6} ${cy+6}" stroke="${dark}" stroke-width="3.4" stroke-linecap="round"/>`;
      case 'spiral':return `<circle cx="${cx}" cy="${cy}" r="6" fill="none" stroke="${dark}" stroke-width="2.4"/><circle cx="${cx}" cy="${cy}" r="2.4" fill="none" stroke="${dark}" stroke-width="2.2"/>`;
      case 'angry': return `<ellipse cx="${cx}" cy="${cy+1}" rx="6" ry="7" fill="${dark}"/><circle cx="${cx-1.6}" cy="${cy-1.4}" r="1.6" fill="#fff"/>`;
      default:      return `<ellipse cx="${cx}" cy="${cy}" rx="6.6" ry="8.4" fill="${dark}"/><circle cx="${cx-2}" cy="${cy-2.6}" r="2.3" fill="#fff"/><circle cx="${cx+1.6}" cy="${cy+2}" r="1.1" fill="#fff" opacity=".7"/>`;
    }
  }
  function mouth(style){
    const dark='#6a5570';
    switch(style){
      case 'smile': return `<path d="M42 65 Q50 74 58 65" fill="none" stroke="${dark}" stroke-width="2.6" stroke-linecap="round"/>`;
      case 'o':     return `<ellipse cx="50" cy="69" rx="5" ry="6.5" fill="#c65b7c"/><ellipse cx="50" cy="71" rx="2.6" ry="3" fill="#8a3a55"/>`;
      case 'fang':  return `<path d="M42 65 Q50 73 58 65" fill="none" stroke="${dark}" stroke-width="2.6" stroke-linecap="round"/><path d="M46 66 l2.4 4 l2.4 -4 z" fill="#fff" stroke="${dark}" stroke-width=".6"/>`;
      case 'flat':  return `<line x1="45" y1="68" x2="55" y2="68" stroke="${dark}" stroke-width="2.4" stroke-linecap="round"/>`;
      default:      return `<path d="M43 65 Q46.5 70 50 65 Q53.5 70 57 65" fill="none" stroke="${dark}" stroke-width="2.4" stroke-linecap="round"/>`; // :3
    }
  }
  function catArt(c){
    const fur=c.fur, ear=c.ear||'#ffc2d1', L={x:38,y:49}, R={x:62,y:49};
    let eyes;
    if(c.eyes==='wink') eyes = eye(L.x,L.y,'happy')+eye(R.x,R.y,'open');
    else eyes = eye(L.x,L.y,c.eyes)+eye(R.x,R.y,c.eyes);
    const brows = c.eyes==='angry' ? `<path d="M30 39 L44 43" stroke="#6a5570" stroke-width="2.6" stroke-linecap="round"/><path d="M70 39 L56 43" stroke="#6a5570" stroke-width="2.6" stroke-linecap="round"/>` : '';
    const cheeks = c.cheek===false ? '' : `<ellipse cx="31" cy="60" rx="6" ry="3.6" fill="#ff9ec0" opacity=".65"/><ellipse cx="69" cy="60" rx="6" ry="3.6" fill="#ff9ec0" opacity=".65"/>`;
    const whisk = `<g stroke="#b9a8c4" stroke-width="1.6" stroke-linecap="round" opacity=".8">
      <line x1="20" y1="56" x2="33" y2="57"/><line x1="19" y1="61" x2="32" y2="61"/>
      <line x1="80" y1="56" x2="67" y2="57"/><line x1="81" y1="61" x2="68" y2="61"/></g>`;
    const float = c.float ? `<text x="76" y="26" font-size="20" text-anchor="middle">${c.float}</text>` : '';
    return `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <path d="M23 36 L33 11 L47 31 Z" fill="${fur}" stroke="rgba(0,0,0,.08)" stroke-width="1.5" stroke-linejoin="round"/>
      <path d="M77 36 L67 11 L53 31 Z" fill="${fur}" stroke="rgba(0,0,0,.08)" stroke-width="1.5" stroke-linejoin="round"/>
      <path d="M28 32 L34 18 L42 30 Z" fill="${ear}"/>
      <path d="M72 32 L66 18 L58 30 Z" fill="${ear}"/>
      <circle cx="50" cy="55" r="33" fill="${fur}" stroke="rgba(0,0,0,.08)" stroke-width="1.5"/>
      <ellipse cx="42" cy="46" rx="16" ry="14" fill="#ffffff" opacity=".16"/>
      ${brows}${eyes}
      <path d="M47.5 60 h5 l-2.5 3.2 z" fill="#ff7a9c"/>
      ${mouth(c.mouth)}
      ${cheeks}${whisk}${float}
    </svg>`;
  }

  // ─────────────────────────────────────────────────────────────
  //  CARD CATALOG
  // ─────────────────────────────────────────────────────────────
  const DEFS = {
    kitten: {name:'Exploding Kitten', emoji:'💥', c:'#ff9db0', soft:'#ffe1e7', desc:'BOOM! You’re out — unless you defuse.',
             cat:{fur:'#ff8f9e', ear:'#ffd0d6', eyes:'x', mouth:'o', float:'💣'}},
    defuse: {name:'Defuse', emoji:'🛡️', c:'#8fe6cf', soft:'#dcf7ef', desc:'Stops one Exploding Kitten.',
             cat:{fur:'#7fd8bd', ear:'#cff2e7', eyes:'happy', mouth:'w', float:'🌿'}},
    attack: {name:'Attack', emoji:'⚡', c:'#ffbb8a', soft:'#ffece0', desc:'End turn — next player takes 2 turns.',
             cat:{fur:'#ffb27a', ear:'#ffe0cb', eyes:'angry', mouth:'fang', float:'⚡'}},
    skip:   {name:'Skip', emoji:'⏭️', c:'#a9c6ff', soft:'#e6efff', desc:'End your turn without drawing.',
             cat:{fur:'#9db8f0', ear:'#dce6ff', eyes:'sleepy', mouth:'w', float:'💤'}},
    favor:  {name:'Favor', emoji:'🙏', c:'#ffb0d8', soft:'#ffe4f3', desc:'A player gives you a card.',
             cat:{fur:'#ff9ecb', ear:'#ffdcef', eyes:'star', mouth:'smile', float:'💗'}},
    shuffle:{name:'Shuffle', emoji:'🔀', c:'#9fe3d8', soft:'#ddf6f2', desc:'Shuffle the draw pile.',
             cat:{fur:'#88d9cb', ear:'#d3f2ec', eyes:'spiral', mouth:'w', float:'🌀'}},
    future: {name:'See the Future', emoji:'🔮', c:'#c9a7ff', soft:'#efe6ff', desc:'Peek at the top 3 cards.',
             cat:{fur:'#b998f5', ear:'#e6d9ff', eyes:'star', mouth:'w', float:'🔮'}},
    nope:   {name:'Nope', emoji:'🚫', c:'#c3c9dd', soft:'#eceff6', desc:'Cancel another player’s action.',
             cat:{fur:'#aeb6cf', ear:'#dfe4f0', eyes:'wink', mouth:'flat', float:'🚫'}},
    // collectible cats (pairs → steal)
    taco:   {name:'Taco Cat', emoji:'🌮', c:'#ffd98a', soft:'#fff2d6', cat2:true,
             cat:{fur:'#ffcf6e', ear:'#ffe9bd', eyes:'open', mouth:'w', float:'🌮'}},
    rainbow:{name:'Rainbow Cat', emoji:'🌈', c:'#9fd6ff', soft:'#e2f2ff', cat2:true,
             cat:{fur:'#8fcdf5', ear:'#d6ecff', eyes:'happy', mouth:'smile', float:'🌈'}},
    beard:  {name:'Beard Cat', emoji:'🧔', c:'#e3c39c', soft:'#f6ead9', cat2:true,
             cat:{fur:'#d8b48b', ear:'#efdcc6', eyes:'open', mouth:'w', float:'🧶'}},
    potato: {name:'Potato Cat', emoji:'🥔', c:'#f0c99a', soft:'#f9ecd9', cat2:true,
             cat:{fur:'#e8bd86', ear:'#f5e2ca', eyes:'open', mouth:'w', float:'🥔'}},
    melon:  {name:'Cattermelon', emoji:'🍉', c:'#9be6a6', soft:'#defbe2', cat2:true,
             cat:{fur:'#86dd94', ear:'#cff4d4', eyes:'happy', mouth:'w', float:'🍉'}},
  };
  const CAT_TYPES = ['taco','rainbow','beard','potato','melon'];
  const NOPEABLE = new Set(['attack','skip','favor','shuffle','future','steal']);

  let uid = 0;
  const mk = type => ({type, id:++uid});

  function cardHTML(type, {playable=false, sel=false, big=false, small=false}={}){
    const d = DEFS[type];
    if(small){
      return `<div class="mini"></div>`;
    }
    return `<div class="card ${playable?'play':''} ${sel?'sel':''} ${big?'big':''}" data-type="${type}" style="--c:${d.c};--soft:${d.soft}">
      <div class="cnr">${d.emoji}</div><div class="cnr2">${d.emoji}</div>
      <div class="art">${catArt(d.cat)}</div>
      <div class="nm">${d.name}</div>
      <div class="ds">${d.desc||''}</div>
    </div>`;
  }

  // ─────────────────────────────────────────────────────────────
  //  GAME STATE
  // ─────────────────────────────────────────────────────────────
  let S = null;
  const AV = ['🐱','🐰','🐹','🦊','🐼','🐨'];

  function newGame(numBots){
    const players = [{id:0, name:'You', isHuman:true, hand:[], alive:true, av:'😺'}];
    for(let i=0;i<numBots;i++) players.push({id:i+1, name:['Mittens','Pumpkin','Biscuit','Waffles','Noodle'][i], isHuman:false, hand:[], alive:true, av:AV[(i+1)%AV.length], peek:null});

    // base deck (no kittens, no defuses)
    let deck = [];
    const add=(t,n)=>{for(let i=0;i<n;i++)deck.push(mk(t));};
    add('attack',4);add('skip',4);add('favor',4);add('shuffle',4);add('future',5);add('nope',5);
    CAT_TYPES.forEach(t=>add(t,4));
    shuffle(deck);

    // deal 7 each
    players.forEach(p=>{ for(let i=0;i<7;i++) p.hand.push(deck.pop()); });
    // one defuse each, extras into deck
    const totalDefuse = 6;
    players.forEach(p=>p.hand.push(mk('defuse')));
    for(let i=0;i<totalDefuse-players.length;i++) deck.push(mk('defuse'));
    // kittens = players - 1
    for(let i=0;i<players.length-1;i++) deck.push(mk('kitten'));
    shuffle(deck);

    players.forEach(p=>sortHand(p));
    S = { players, deck, discard:[], turn:0, turnsRemaining:1, busy:false, over:false, log:[] };
    logMsg('A fresh litter is dealt! 🐾 Play cards, then draw to end your turn.');
    render();
    beginTurn();
  }

  const ORDER = ['kitten','defuse','attack','skip','favor','future','shuffle','nope','taco','rainbow','beard','potato','melon'];
  function sortHand(p){ p.hand.sort((a,b)=>ORDER.indexOf(a.type)-ORDER.indexOf(b.type) || a.id-b.id); }
  const me = () => S.players[0];
  const alivePlayers = () => S.players.filter(p=>p.alive);
  const has = (p,t) => p.hand.some(c=>c.type===t);
  const countType = (p,t) => p.hand.filter(c=>c.type===t).length;
  function removeOne(p,t){ const i=p.hand.findIndex(c=>c.type===t); if(i<0)return null; return p.hand.splice(i,1)[0]; }
  function logMsg(m){ S.log.push(m); if(S.log.length>40) S.log.shift(); }

  function nextAlive(from){ let i=from; for(let k=0;k<S.players.length;k++){ i=(i+1)%S.players.length; if(S.players[i].alive) return i; } return from; }

  // ─────────────────────────────────────────────────────────────
  //  RENDER
  // ─────────────────────────────────────────────────────────────
  function render(){
    if(!S){ return; }
    const opps = S.players.slice(1).map(p=>`
      <div class="opp ${S.turn===p.id&&!S.over?'active':''} ${p.alive?'':'dead'}">
        ${p.alive?'':'<div class="badge">💀</div>'}
        <div class="who"><span style="font-size:18px">${p.av}</span> ${p.name}</div>
        <div class="backs">${p.alive? p.hand.slice(0,8).map(()=>'<div class="mini"></div>').join(''):'<span style="font-size:22px">🙀</span>'}</div>
        <div class="cnt">${p.alive? p.hand.length+' cards':'exploded'}</div>
      </div>`).join('');

    const top = S.discard[S.discard.length-1];
    const turnP = S.players[S.turn];
    const turnTxt = S.over ? '' : (turnP.isHuman ? `<b>Your</b> turn — play a card or draw` : `<b>${turnP.name}</b> is thinking…`);

    app.innerHTML = `
      <header>
        <div class="logo">
          <span style="font-size:30px">🐱</span>
          <div>
            <div class="tt">Exploding <em>Kittens</em></div>
            <div class="sub">cute prototype · single player vs bots</div>
          </div>
        </div>
        <div style="display:flex;gap:8px;align-items:center">
          <a class="home" href="/">← ZipZap</a>
          <button class="btn ghost" id="newbtn">New game</button>
        </div>
      </header>

      <div class="opps">${opps}</div>

      <div class="table">
        <div class="pile">
          <div class="lbl">Draw pile</div>
          <div class="deck ${(!S.over&&turnP.isHuman&&!S.busy)?'pulse':''}" id="deck"><span class="paw">🐾</span><span class="num">${S.deck.length}</span></div>
        </div>
        <div class="pile">
          <div class="lbl">Discard</div>
          ${top? cardHTML(top.type,{}) : '<div class="discard empty">played cards land here</div>'}
        </div>
      </div>

      <div class="turnline">${turnTxt}</div>
      <div class="log" id="log">${S.log.map(l=>`<div>${l}</div>`).join('')}</div>

      <div class="handwrap">
        <div class="handlbl"><span class="t">Your paw 🐾</span><span class="t">${me().alive?me().hand.length+' cards':'💥 out'}</span></div>
        <div class="hand" id="hand">
          ${me().alive? me().hand.map((c,i)=>cardHTML(c.type,{playable:canAct()})).map((h,i)=>h.replace('data-type',`data-idx="${i}" data-type`)).join('') : '<div class="hint">💥 You exploded. Better luck next round!</div>'}
        </div>
      </div>

      <div class="controls">
        ${canAct()? `<button class="btn mint" id="drawbtn">Draw a card 🐾 (end turn)</button>` : ''}
        <span class="hint">${canAct()? 'Tip: play an action first, or tap a matching pair of cats to steal 😼' : (S.over?'':'')}</span>
      </div>
    `;

    // wire
    const nb = $('#newbtn'); if(nb) nb.onclick = ()=>chooseBots();
    const db = $('#drawbtn'); if(db) db.onclick = ()=>humanDraw();
    const deck = $('#deck'); if(deck && canAct()) deck.onclick = ()=>humanDraw();
    if(canAct()){
      document.querySelectorAll('#hand .card').forEach(el=>{
        el.onclick = ()=>humanPlay(+el.dataset.idx);
      });
    }
    const logEl = $('#log'); if(logEl) logEl.scrollTop = logEl.scrollHeight;
  }

  function canAct(){ return S && !S.over && !S.busy && S.players[S.turn].isHuman && me().alive; }

  // ─────────────────────────────────────────────────────────────
  //  MODALS
  // ─────────────────────────────────────────────────────────────
  function closeModal(){ overlay.classList.remove('on'); overlay.innerHTML=''; }
  function modal(html){ overlay.innerHTML = `<div class="modal">${html}</div>`; overlay.classList.add('on'); }
  function choose(title, sub, options){ // options:[{label,value,cls}]
    return new Promise(res=>{
      modal(`<h2>${title}</h2>${sub?`<p>${sub}</p>`:''}<div class="modal-btns">${
        options.map((o,i)=>`<button class="btn ${o.cls||''}" data-i="${i}">${o.label}</button>`).join('')}</div>`);
      overlay.querySelectorAll('.btn').forEach(b=>b.onclick=()=>{ closeModal(); res(options[+b.dataset.i].value); });
    });
  }

  // ─────────────────────────────────────────────────────────────
  //  TURN FLOW
  // ─────────────────────────────────────────────────────────────
  function beginTurn(){
    if(S.over) return;
    if(alivePlayers().length<=1){ return endGame(); }
    const p = S.players[S.turn];
    if(!p.alive){ S.turn = nextAlive(S.turn); S.turnsRemaining=1; return beginTurn(); }
    render();
    if(p.isHuman){ /* wait for the player */ }
    else botTurn(p);
  }

  // one obligation (a draw or skip) completed
  function finishObligation(){
    S.turnsRemaining--;
    if(S.turnsRemaining>0){ render(); const p=S.players[S.turn]; if(!p.isHuman) botTurn(p); }
    else { S.turn = nextAlive(S.turn); S.turnsRemaining=1; beginTurn(); }
  }
  // Attack: end all my turns, hand 2 to the next player
  function attackHandoff(){
    S.turn = nextAlive(S.turn); S.turnsRemaining=2; beginTurn();
  }

  // ─────────────────────────────────────────────────────────────
  //  NOPE resolution (chain)
  // ─────────────────────────────────────────────────────────────
  function botWouldNope(bot, actor, actionType, targetsBot){
    if(!has(bot,'nope')) return false;
    let p = 0.12;
    if(actionType==='attack' && targetsBot) p=0.4;
    if(actionType==='favor' && targetsBot) p=0.5;
    if(actionType==='steal' && targetsBot) p=0.45;
    if(actionType==='future') p=0.05;
    return Math.random() < p;
  }
  async function nopePrompt(){
    return new Promise(res=>{
      modal(`<h2>Nope it? 🚫</h2><p>Cancel that action with your Nope card.</p>
        <div class="modal-btns"><button class="btn" data-i="1">NOPE! 🚫</button><button class="btn ghost" data-i="0">let it happen</button></div>
        <div class="tinytimer"><i id="tt"></i></div>`);
      const tt = overlay.querySelector('#tt'); tt.style.transition='width 4.5s linear'; requestAnimationFrame(()=>tt.style.width='0%');
      let done=false;
      const finish=v=>{ if(done)return; done=true; clearTimeout(to); closeModal(); res(v); };
      overlay.querySelectorAll('.btn').forEach(b=>b.onclick=()=>finish(b.dataset.i==='1'));
      const to=setTimeout(()=>finish(false),4500);
    });
  }
  // returns true if the action proceeds (not canceled)
  async function resolveNope(actor, actionType, target){
    let canceled=false, last=actor;
    while(true){
      const responders = S.players.filter(p=>p.alive && p!==last && has(p,'nope'));
      if(!responders.length) break;
      let noper=null;
      // human first
      const human = responders.find(p=>p.isHuman);
      if(human){
        const label = actionType==='steal'?'a sneaky steal':DEFS[actionType]?DEFS[actionType].name:actionType;
        S.busy=true; render();
        const wants = await nopePrompt();
        if(wants && has(human,'nope')) noper=human;
      }
      if(!noper){
        for(const b of responders.filter(p=>!p.isHuman)){
          if(botWouldNope(b, last, actionType, target && b===target)){ noper=b; break; }
        }
      }
      if(!noper) break;
      S.discard.push(removeOne(noper,'nope'));
      canceled=!canceled;
      logMsg(`${noper.name} plays NOPE! ${canceled?'❌ blocked':'✅ un-noped (Yup!)'}`);
      last=noper; render(); await sleep(650);
    }
    S.busy=false;
    return !canceled;
  }

  // ─────────────────────────────────────────────────────────────
  //  ACTIONS
  // ─────────────────────────────────────────────────────────────
  async function playCard(actor, type, effect, {actionType=type, target=null, silent=false}={}){
    if(!silent){ logMsg(`${actor.name} played ${DEFS[type].name} ${DEFS[type].emoji}`); render(); await sleep(420); }
    let ok = true;
    if(NOPEABLE.has(actionType)) ok = await resolveNope(actor, actionType, target);
    if(ok){ await effect(); }
    else { render(); await sleep(300); }
    return ok;
  }

  async function doSeeFuture(actor){
    const top3 = S.deck.slice(-3).reverse(); // top first
    if(actor.isHuman){
      modal(`<h2>The future… 🔮</h2><p>Top of the pile is on the left.</p>
        <div class="modal-row">${top3.length? top3.map(c=>cardHTML(c.type,{big:true})).join('') : '<p>The pile is empty!</p>'}</div>
        <div class="modal-btns"><button class="btn" id="ok">Got it 😼</button></div>`);
      await new Promise(r=>{ overlay.querySelector('#ok').onclick=()=>{closeModal();r();}; });
    } else {
      actor.peek = top3.map(c=>c.type);
    }
  }
  function doShuffle(){ shuffle(S.deck); S.players.forEach(p=>p.peek=null); logMsg('🌀 The pile is shuffled!'); }

  async function doFavor(actor, targetId){
    const target = S.players.find(p=>p.id===targetId);
    if(!target || !target.alive || !target.hand.length){ logMsg(`${target?target.name:'?'} had nothing to give.`); return; }
    let given;
    if(target.isHuman){
      // human chooses which card to give
      const idx = await pickFromHand(target, `Give a card to ${actor.name}`, `${actor.name} played Favor 🙏 — pick one to hand over.`);
      given = target.hand.splice(idx,1)[0];
    } else {
      // bot gives its least useful card
      given = botGiveCard(target);
    }
    actor.hand.push(given); sortHand(actor);
    logMsg(`${target.name} gave ${actor.name} a card 🎁`);
  }

  async function doSteal(actor, targetId, catType){
    const target = S.players.find(p=>p.id===targetId);
    if(!target || !target.alive || !target.hand.length){ logMsg(`Nothing to steal from ${target?target.name:'?'}.`); return; }
    const idx = rnd(target.hand.length);
    const stolen = target.hand.splice(idx,1)[0];
    actor.hand.push(stolen); sortHand(actor);
    logMsg(`${actor.name} swiped a random card from ${target.name} 😼`);
  }

  // draw a card to end an obligation
  async function drawCard(actor){
    S.busy=true; render();
    if(!S.deck.length){ logMsg('The pile is empty! Reshuffling discards.'); /* safety */ S.deck = shuffle(S.discard.splice(0)); }
    const card = S.deck.pop();
    S.players.forEach(p=>{ if(p.peek) p.peek.shift(); });
    if(card.type==='kitten'){
      logMsg(`${actor.name} drew an EXPLODING KITTEN! 💥`);
      render(); await sleep(500);
      if(has(actor,'defuse')){
        S.discard.push(removeOne(actor,'defuse'));
        logMsg(`${actor.name} used a Defuse 🛡️ — phew!`);
        await placeKitten(actor, card);
      } else {
        actor.alive=false;
        S.discard.push(card);
        logMsg(`💥 ${actor.name} exploded and is out!`);
        await boom(actor);
        S.busy=false;
        if(alivePlayers().length<=1){ return endGame(); }
        // exploded player's obligations end
        S.turn = nextAlive(S.turn); S.turnsRemaining=1; return beginTurn();
      }
    } else {
      actor.hand.push(card); sortHand(actor);
      if(actor.isHuman){ logMsg(`You drew ${DEFS[card.type].name} ${DEFS[card.type].emoji}.`); render(); await revealDraw(card); }
      else logMsg(`${actor.name} drew a card.`);
    }
    S.busy=false;
    finishObligation();
  }

  // Clearly show the human the card they just drew.
  function revealDraw(card){
    const d = DEFS[card.type];
    return new Promise(res=>{
      modal(`<h2>You drew…</h2>
        <div class="modal-row" style="margin-bottom:6px">${cardHTML(card.type,{big:true})}</div>
        <div style="font-weight:800;font-size:17px">${d.emoji} ${d.name}</div>
        <p style="margin-top:4px;margin-bottom:12px">${d.desc||'Play a matching pair to steal a card'}</p>
        <div class="modal-btns"><button class="btn" id="drewok">Got it 😺</button></div>`);
      let done=false; const fin=()=>{ if(done)return; done=true; clearTimeout(to); closeModal(); res(); };
      overlay.querySelector('#drewok').onclick=fin;
      const to=setTimeout(fin,2600);
    });
  }

  async function placeKitten(actor, card){
    let pos;
    const n = S.deck.length;
    if(actor.isHuman){
      pos = await choose('Hide the kitten 🙀', 'Slip it back into the pile — where should it lurk?', [
        {label:'On top (evil 😈)', value:n},
        {label:'2nd from top', value:n-1},
        {label:'Random', value:-1},
        {label:'Middle', value:Math.floor(n/2)},
        {label:'Bottom', value:0},
      ]);
    } else {
      // bots: often put on top to hit the next player, else random
      pos = Math.random()<0.5 ? n : -1;
    }
    if(pos===-1) pos = rnd(n+1);
    pos = Math.max(0, Math.min(n, pos));
    S.deck.splice(pos, 0, card);
    logMsg(`${actor.name} tucked the kitten back into the pile… 🐈‍⬛`);
    render();
  }

  async function boom(actor){
    modal(`<h2>💥 BOOM!</h2><p>${actor.isHuman?'You':actor.name} drew an Exploding Kitten with no defuse!</p>
      <div style="font-size:64px;margin:6px 0">🙀</div>
      <div class="modal-btns"><button class="btn" id="ok">Oh no 😿</button></div>`);
    await new Promise(r=>{ overlay.querySelector('#ok').onclick=()=>{closeModal();r();}; });
  }

  // ─────────────────────────────────────────────────────────────
  //  HUMAN INPUT
  // ─────────────────────────────────────────────────────────────
  function pickTarget(prompt){
    const opts = S.players.filter(p=>!p.isHuman && p.alive && p.hand.length)
      .map(p=>({label:`${p.av} ${p.name}`, value:p.id}));
    if(!opts.length) return Promise.resolve(null);
    if(opts.length===1) return Promise.resolve(opts[0].value);
    return choose(prompt, 'Pick a kitty to target:', opts);
  }
  function pickFromHand(p, title, sub){
    return new Promise(res=>{
      modal(`<h2>${title}</h2><p>${sub}</p>
        <div class="modal-row" style="max-height:210px;overflow:auto">${p.hand.map((c,i)=>`<div data-i="${i}">${cardHTML(c.type,{})}</div>`).join('')}</div>`);
      overlay.querySelectorAll('[data-i]').forEach(el=>el.onclick=()=>{ closeModal(); res(+el.dataset.i); });
    });
  }

  async function humanPlay(idx){
    if(!canAct()) return;
    const card = me().hand[idx];
    if(!card) return;
    const t = card.type;

    if(t==='defuse'){ toast("Save your defuse for an exploding kitten! 🛡️"); return; }
    if(t==='nope'){ toast("Nope plays automatically when you can block someone 🚫"); return; }
    if(t==='kitten'){ return; }

    if(DEFS[t].cat2){ // needs a matching pair
      if(countType(me(),t) < 2){ toast(`Need a matching pair of ${DEFS[t].name} to steal 😿`); return; }
      const target = await pickTarget('Steal from…');
      if(target==null){ toast('No one to steal from!'); return; }
      S.busy=true; render();
      S.discard.push(removeOne(me(),t)); S.discard.push(removeOne(me(),t)); render();
      await playCard(me(), t, ()=>doSteal(me(), target, t), {actionType:'steal', target:S.players.find(p=>p.id===target)});
      S.busy=false; render();
      return;
    }

    // single-play action cards
    S.busy=true; render();
    S.discard.push(me().hand.splice(idx,1)[0]); render();

    if(t==='attack'){
      const ok = await playCard(me(), t, async()=>{}, {actionType:'attack'});
      S.busy=false;
      if(ok){ attackHandoff(); } else { render(); }
      return;
    }
    if(t==='skip'){
      const ok = await playCard(me(), t, async()=>{}, {actionType:'skip'});
      S.busy=false;
      if(ok){ finishObligation(); } else { render(); }
      return;
    }
    if(t==='future'){ await playCard(me(), t, ()=>doSeeFuture(me()), {actionType:'future'}); S.busy=false; render(); return; }
    if(t==='shuffle'){ await playCard(me(), t, async()=>doShuffle(), {actionType:'shuffle'}); S.busy=false; render(); return; }
    if(t==='favor'){
      const target = await pickTarget('Ask a favor from…');
      if(target==null){ // put card back
        me().hand.push(S.discard.pop()); sortHand(me()); S.busy=false; render(); toast('No valid target.'); return;
      }
      await playCard(me(), t, ()=>doFavor(me(), target), {actionType:'favor', target:S.players.find(p=>p.id===target)});
      S.busy=false; render(); return;
    }
    S.busy=false; render();
  }

  function humanDraw(){ if(!canAct()) return; drawCard(me()); }

  let toastTimer;
  function toast(msg){
    let el=$('#_t'); if(!el){ el=document.createElement('div'); el.id='_t';
      el.style.cssText='position:fixed;left:50%;top:16px;transform:translateX(-50%);background:#4a3b57;color:#fff;padding:10px 16px;border-radius:14px;font-weight:800;font-family:Nunito,sans-serif;font-size:13px;z-index:99;box-shadow:0 8px 20px -6px rgba(0,0,0,.4);max-width:88vw;text-align:center';
      document.body.appendChild(el); }
    el.textContent=msg; el.style.opacity='1'; clearTimeout(toastTimer); toastTimer=setTimeout(()=>el.style.opacity='0',2200);
  }

  // ─────────────────────────────────────────────────────────────
  //  BOT AI
  // ─────────────────────────────────────────────────────────────
  function botGiveCard(bot){
    // give away least useful: a lone cat, else a shuffle/future, never defuse/nope
    const pri = ['shuffle','future','taco','rainbow','beard','potato','melon','favor','skip','attack','nope','defuse'];
    for(const t of pri){ if(has(bot,t) && !(t==='defuse')) return removeOne(bot,t); }
    return bot.hand.pop();
  }
  function botCatPair(bot){
    for(const t of CAT_TYPES){ if(countType(bot,t)>=2) return t; }
    return null;
  }
  async function botTurn(bot){
    if(S.over || !bot.alive) return;
    S.busy=true; render(); await sleep(700);

    // peek with See the Future sometimes
    if(has(bot,'future') && !bot.peek && Math.random()<0.55){
      S.discard.push(removeOne(bot,'future'));
      await playCard(bot,'future',()=>doSeeFuture(bot),{actionType:'future'});
      await sleep(400);
    }

    const topKitten = bot.peek && bot.peek[0]==='kitten';
    // danger avoidance
    if(topKitten && !has(bot,'defuse')){
      if(has(bot,'attack')){ S.discard.push(removeOne(bot,'attack')); const ok=await playCard(bot,'attack',async()=>{},{actionType:'attack'}); S.busy=false; return ok?attackHandoff():render(); }
      if(has(bot,'skip')){ S.discard.push(removeOne(bot,'skip')); const ok=await playCard(bot,'skip',async()=>{},{actionType:'skip'}); S.busy=false; return ok?finishObligation():render(); }
      if(has(bot,'shuffle')){ S.discard.push(removeOne(bot,'shuffle')); await playCard(bot,'shuffle',async()=>doShuffle(),{actionType:'shuffle'}); }
    }

    // steal via a cat pair sometimes
    const pair = botCatPair(bot);
    if(pair && Math.random()<0.4){
      const targets = S.players.filter(p=>p!==bot && p.alive && p.hand.length);
      if(targets.length){
        const target = targets[rnd(targets.length)];
        S.discard.push(removeOne(bot,pair)); S.discard.push(removeOne(bot,pair)); render();
        await playCard(bot,pair,()=>doSteal(bot,target.id,pair),{actionType:'steal',target});
        await sleep(300);
      }
    }

    // occasionally attack/skip to be annoying
    if(!topKitten && has(bot,'attack') && Math.random()<0.22){
      S.discard.push(removeOne(bot,'attack')); const ok=await playCard(bot,'attack',async()=>{},{actionType:'attack'});
      S.busy=false; return ok?attackHandoff():render();
    }
    if(!topKitten && has(bot,'skip') && bot.hand.length>9 && Math.random()<0.3){
      S.discard.push(removeOne(bot,'skip')); const ok=await playCard(bot,'skip',async()=>{},{actionType:'skip'});
      S.busy=false; return ok?finishObligation():render();
    }

    // otherwise draw
    S.busy=false;
    await drawCard(bot);
  }

  // ─────────────────────────────────────────────────────────────
  //  END
  // ─────────────────────────────────────────────────────────────
  function endGame(){ S.over=true; render(); const w=alivePlayers()[0];
    const iWon = w && w.isHuman;
    modal(`<h2>${iWon?'😻 You win!':'😿 '+(w?w.name:'Nobody')+' wins'}</h2>
      <p>${iWon?'Last kitty standing — purrfect!':'The last cool cat survives the pile.'}</p>
      <div style="font-size:64px;margin:6px 0">${iWon?'🏆':w?w.av:'🐾'}</div>
      <div class="modal-btns"><button class="btn" id="again">Play again 🐾</button></div>`);
    overlay.querySelector('#again').onclick=()=>{ closeModal(); chooseBots(); };
  }

  function endGameCheck(){ if(alivePlayers().length<=1) endGame(); }

  // ─────────────────────────────────────────────────────────────
  //  START
  // ─────────────────────────────────────────────────────────────
  function chooseBots(){
    modal(`<h2>🐱 Exploding Kittens</h2><p>How many kitty opponents?</p>
      <div class="modal-btns">
        <button class="btn" data-n="1">1 bot</button>
        <button class="btn" data-n="2">2 bots</button>
        <button class="btn" data-n="3">3 bots</button>
        <button class="btn" data-n="4">4 bots</button>
      </div>
      <p style="margin-top:12px;margin-bottom:0">Draw cards without exploding — last cat wins. 💥</p>`);
    overlay.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{ closeModal(); newGame(+b.dataset.n); });
  }

  chooseBots();
})();
</script>
</body>
